<!DOCTYPE html>
<html>
<head>
  <title>Lazy Placeholders Test</title>
  <style>
    .spacer { height: 2000px; background: #eee; }
    .far { height: 9500px; }
    img { display: block; width: 200px; height: 200px; }
  </style>
</head>
<body>
  <h1>Lazy Placeholders Test Page</h1>
  <!-- Images a lazy-load library (lazysizes, as on spiegel.de) fills in once
       they scroll into view. No library runs here, so only WRL fills them. -->
  <div class="spacer"></div>
  <img class="lazyload" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'%3E%3C/svg%3E" data-src="/lazy-pixel.png?ds=1" alt="data-src image" data-testid="ds-1">
  <picture>
    <source data-srcset="/lazy-pixel.png?pic=1 1x, /lazy-pixel.png?pic=2 2x" type="image/png">
    <img class="lazyload" data-src="/lazy-pixel.png?pic=img" alt="picture image" data-testid="pic-1">
  </picture>
  <img class="lazyload loaded" src="/lazy-pixel.png?real=1" data-src="/lazy-pixel.png?other=1" alt="already loaded" data-testid="real-1">
  <!-- A closed menu, as on samsung.com: laid out but not visible -->
  <nav style="visibility: hidden"><img class="lazy-load-man" data-src="/lazy-pixel.png?menu=1" alt="" data-testid="menu-1"></nav>
  <!-- Below the screenshot: left alone, so a long page doesn't load hundreds of images -->
  <div class="far"></div>
  <img class="lazyload" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" data-src="/lazy-pixel.png?far=1" alt="far image" data-testid="far-1">
</body>
</html>
