#:schema node_modules/wrangler/config-schema.json
name = "wrl"
main = "src/index.js"
compatibility_date = "2026-03-13"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "wrl-metadata"
database_id = "e07352f4-2fa3-48fb-b520-f101395905e5"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "wrl-captures"
preview_bucket_name = "wrl-captures-preview"

[[kv_namespaces]]
binding = "KV"
id = "b5cd6168cd32485dba7a90558e5fad29"
preview_id = "d7d4739a73074b9793889046e59c9323"

# Per-tenant rate limiter -- ceiling at 100/60s.
# Actual per-tenant limits enforced in application code via KV counters (default: 10/60s).
# This binding prevents any tenant from exceeding 100 req/min regardless of KV config.
[[unsafe.bindings]]
name = "CAPTURE_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 100, period = 60 }

[[unsafe.bindings]]
name = "VERIFY_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[[unsafe.bindings]]
name = "GLOBAL_CAPTURE_LIMITER"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 200, period = 60 }

[[unsafe.bindings]]
name = "ADMIN_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1004"
simple = { limit = 5, period = 60 }

[[unsafe.bindings]]
name = "CAPTURE_IP_GUARD"
type = "ratelimit"
namespace_id = "1005"
simple = { limit = 50, period = 60 }

[[unsafe.bindings]]
name = "AUTH_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1006"
simple = { limit = 10, period = 60 }

[browser]
binding = "BROWSER"

# CPU time limit (not wall clock): 60 s of CPU execution covers the capture
# pipeline including WACZ bundling.  Wall clock is bounded by RENDER_DEADLINE_MS
# (600 s) in capture.js.  Default (30 s for paid plans) is too tight.
[limits]
cpu_ms = 60000

# --- Cron Triggers ---
# Fires every minute to evaluate tenant-defined capture schedules.
# The scheduled() handler queries D1 for due schedules, then enqueues
# capture jobs onto the existing wrl-captures queue.
# NOTE: cron triggers are non-inheritable -- each environment must declare its own [triggers].
[triggers]
crons = ["*/1 * * * *", "0 3 * * *", "0 9 * * 1"]

# --- Custom domains ---
# Cloudflare auto-provisions DNS records when custom_domain = true.
# NOTE: [[routes]] table-array syntax does not inherit into env.staging -- staging
# must declare its own [[env.staging.routes]] entries.
[[routes]]
pattern = "api.webresourceledger.com"
custom_domain = true

[[routes]]
pattern = "verify.webresourceledger.com"
custom_domain = true

# --- Queue architecture ---
# Two queues per environment:
#   wrl-captures        -- main processing queue (capture jobs)
#   wrl-captures-dlq    -- dead-letter queue (jobs exhausted max_retries)
# The same Worker exports both fetch() and queue() handlers; no separate
# consumer Worker is required.  max_batch_size = 1 ensures each invocation
# processes exactly one capture so failures are isolated.

[[queues.producers]]
binding = "CAPTURE_QUEUE"
queue = "wrl-captures"

[[queues.consumers]]
queue = "wrl-captures"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "wrl-captures-dlq"
max_concurrency = 10

[[queues.producers]]
binding = "CAPTURE_DLQ"
queue = "wrl-captures-dlq"

[[queues.consumers]]
queue = "wrl-captures-dlq"
max_batch_size = 1
max_batch_timeout = 30
max_retries = 0

# Webhook delivery queue -- one message per (capture, webhook) pair.
# max_batch_size = 1 isolates failures. max_concurrency = 20 supports burst fan-out.
[[queues.producers]]
binding = "WEBHOOK_QUEUE"
queue = "wrl-webhooks"

[[queues.consumers]]
queue = "wrl-webhooks"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "wrl-webhooks-dlq"
max_concurrency = 20

[[queues.producers]]
binding = "WEBHOOK_DLQ"
queue = "wrl-webhooks-dlq"

[[queues.consumers]]
queue = "wrl-webhooks-dlq"
max_batch_size = 1
max_batch_timeout = 30
max_retries = 0

# Email notification delivery queue -- one message per outbound notification.
# max_batch_size = 1 isolates failures. max_concurrency = 5 limits Resend API concurrency.
[[queues.producers]]
binding = "EMAIL_QUEUE"
queue = "wrl-emails"

[[queues.consumers]]
queue = "wrl-emails"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "wrl-emails-dlq"
max_concurrency = 5

[[queues.producers]]
binding = "EMAIL_DLQ"
queue = "wrl-emails-dlq"

[[queues.consumers]]
queue = "wrl-emails-dlq"
max_batch_size = 1
max_batch_timeout = 30
max_retries = 0

# Observability: Coralogix log ingestion
# CORALOGIX_SEND_KEY must be set via: wrangler secret put CORALOGIX_SEND_KEY
# IP_HASH_SEED must be set via: wrangler secret put IP_HASH_SEED
# OAuth secrets (set via wrangler secret put):
#   GITHUB_CLIENT_SECRET -- GitHub OAuth App client secret
#   SESSION_SECRET       -- HMAC key for session cookie signing (32+ random bytes, hex)
# Stripe secrets (set via wrangler secret put):
#   STRIPE_SECRET_KEY    -- Stripe secret key (sk_live_...)
#   STRIPE_WEBHOOK_SECRET -- Stripe webhook signing secret (whsec_...)
# Email secrets (set via wrangler secret put):
#   RESEND_API_KEY       -- Resend API key for transactional email delivery
# Threat check (set via wrangler secret put):
#   GOOGLE_WEB_RISK_API_KEY -- Google Web Risk API key (without this, threat checks degrade gracefully)
[vars]
CORALOGIX_ENDPOINT = "https://ingress.eu2.coralogix.com/logs/v1/singles"
APPLICATION_NAME = "wrl"
TSA_URL = "https://timestamp.digicert.com"
# Qualified (eIDAS) TSA -- used when tenant has eidas_qualified enabled.
# Auth credential set via: wrangler secret put QUALIFIED_TSA_AUTH
# (pre-encoded base64 user:pass for HTTP Basic auth; omit for TSAs needing no auth)
QUALIFIED_TSA_URL = "https://timestamp.sectigo.com/qualified"
GITHUB_CLIENT_ID = "Ov23liIG5Of9wSbgcFqW"
STRIPE_PUBLISHABLE_KEY = "pk_live_51TDsOBR6ZdLyu7lGn7qg5KGMLs2mcYvkV4GHrYvGymIMxABXUEJjVOdl8BHnUrLoHMvM9HH8FNenohLPZABdRA3X002Ajerxi0"
STRIPE_CAPTURE_PRICE_ID = "price_1TE4aAR6ZdLyu7lGVLN895yU"
# Cron expression for the nightly URL re-scan job. Must match the value in [triggers].crons.
RESCAN_CRON = "0 3 * * *"
# Comma-separated origins allowed for CORS preflight (browser clients).
# Omit or leave empty to disable CORS. No wildcards.
# CORS_ORIGINS = "https://my-extension.example.com"

# --- Staging environment ---
# Fully isolated: separate Worker, KV, R2, rate limiters.
# Secrets (CAPTURE_API_KEY, SIGNING_KEY, CORALOGIX_SEND_KEY, IP_HASH_SEED) are set via:
#   wrangler secret put <NAME> --env staging

[env.staging]

[[env.staging.routes]]
pattern = "staging.webresourceledger.com"
custom_domain = true

[[env.staging.routes]]
pattern = "verify-staging.webresourceledger.com"
custom_domain = true

[[env.staging.d1_databases]]
binding = "DB"
database_name = "wrl-metadata-staging"
database_id = "9fbec860-89db-4fd6-bd1b-944d416ce57e"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "BUCKET"
bucket_name = "wrl-captures-staging"

[[env.staging.kv_namespaces]]
binding = "KV"
# Replace with output of: wrangler kv namespace create KV --env staging
id = "ed564f8e8f4d4133aaee779e7f9e61cb"

# Per-tenant rate limiter -- ceiling at 100/60s.
# Actual per-tenant limits enforced in application code via KV counters (default: 10/60s).
# This binding prevents any tenant from exceeding 100 req/min regardless of KV config.
[[env.staging.unsafe.bindings]]
name = "CAPTURE_RATE_LIMITER"
type = "ratelimit"
namespace_id = "2001"
simple = { limit = 100, period = 60 }

[[env.staging.unsafe.bindings]]
name = "VERIFY_RATE_LIMITER"
type = "ratelimit"
namespace_id = "2002"
simple = { limit = 60, period = 60 }

[[env.staging.unsafe.bindings]]
name = "GLOBAL_CAPTURE_LIMITER"
type = "ratelimit"
namespace_id = "2003"
simple = { limit = 200, period = 60 }

[[env.staging.unsafe.bindings]]
name = "ADMIN_RATE_LIMITER"
type = "ratelimit"
namespace_id = "2004"
simple = { limit = 5, period = 60 }

[[env.staging.unsafe.bindings]]
name = "CAPTURE_IP_GUARD"
type = "ratelimit"
namespace_id = "2005"
simple = { limit = 50, period = 60 }

[[env.staging.unsafe.bindings]]
name = "AUTH_RATE_LIMITER"
type = "ratelimit"
namespace_id = "2006"
simple = { limit = 10, period = 60 }

[env.staging.browser]
binding = "BROWSER"

[env.staging.limits]
cpu_ms = 60000

# Cron triggers are non-inheritable -- staging must declare its own [triggers].
[env.staging.triggers]
crons = ["*/1 * * * *", "0 4 * * *", "0 9 * * 1"]

# Queues are non-inheritable -- staging must declare its own producers and
# consumers with -staging suffixed queue names.

[[env.staging.queues.producers]]
binding = "CAPTURE_QUEUE"
queue = "wrl-captures-staging"

[[env.staging.queues.consumers]]
queue = "wrl-captures-staging"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "wrl-captures-staging-dlq"
# Match browser session pool limit -- queue holds excess messages instead of
# delivering work that fails with "session pool at capacity"
max_concurrency = 2

[[env.staging.queues.producers]]
binding = "CAPTURE_DLQ"
queue = "wrl-captures-staging-dlq"

[[env.staging.queues.consumers]]
queue = "wrl-captures-staging-dlq"
max_batch_size = 1
max_batch_timeout = 30
max_retries = 0

# Webhook delivery queue (staging)
[[env.staging.queues.producers]]
binding = "WEBHOOK_QUEUE"
queue = "wrl-webhooks-staging"

[[env.staging.queues.consumers]]
queue = "wrl-webhooks-staging"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "wrl-webhooks-staging-dlq"
max_concurrency = 10

[[env.staging.queues.producers]]
binding = "WEBHOOK_DLQ"
queue = "wrl-webhooks-staging-dlq"

[[env.staging.queues.consumers]]
queue = "wrl-webhooks-staging-dlq"
max_batch_size = 1
max_batch_timeout = 30
max_retries = 0

# Email notification delivery queue (staging)
[[env.staging.queues.producers]]
binding = "EMAIL_QUEUE"
queue = "wrl-emails-staging"

[[env.staging.queues.consumers]]
queue = "wrl-emails-staging"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "wrl-emails-staging-dlq"
max_concurrency = 2

[[env.staging.queues.producers]]
binding = "EMAIL_DLQ"
queue = "wrl-emails-staging-dlq"

[[env.staging.queues.consumers]]
queue = "wrl-emails-staging-dlq"
max_batch_size = 1
max_batch_timeout = 30
max_retries = 0

[env.staging.vars]
CORALOGIX_ENDPOINT = "https://ingress.eu2.coralogix.com/logs/v1/singles"
APPLICATION_NAME = "wrl-staging"
TSA_URL = "https://timestamp.digicert.com"
# Qualified (eIDAS) TSA -- used when tenant has eidas_qualified enabled.
# Auth credential set via: wrangler secret put QUALIFIED_TSA_AUTH --env staging
# (pre-encoded base64 user:pass for HTTP Basic auth; omit for TSAs needing no auth)
QUALIFIED_TSA_URL = "https://timestamp.sectigo.com/qualified"
GITHUB_CLIENT_ID = "Ov23li0lii7I7Y43lbUs"
STRIPE_PUBLISHABLE_KEY = "pk_test_51TDsOOJQK0cymoiEZrNp6PBKISzkLV3LCIxOIjQ2pkQdcDYtQRECpLiWUagaLe0PtE8Owu7x8bsu5gLemtHMj58G00PTk19u4B"
STRIPE_CAPTURE_PRICE_ID = "price_1TE3yVJQK0cymoiEc5eoRpBv"
RESCAN_CRON = "0 4 * * *"
# Comma-separated origins allowed for CORS preflight (browser clients).
# Omit or leave empty to disable CORS. No wildcards.
# CORS_ORIGINS = "https://my-extension.example.com"
