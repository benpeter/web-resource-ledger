openapi: 3.1.0
info:
  title: Web Resource Ledger API
  version: 0.2.0
  description: Capture web page screenshots, rendered HTML, and HTTP headers via headless Chromium.
  license:
    name: Apache 2.0
    identifier: Apache-2.0

servers:
  - url: https://wrl.example.com
    description: Production

tags:
  - name: health
    description: Service health
  - name: captures
    description: Web page capture lifecycle
  - name: verification
    description: WACZ bundle cryptographic verification
  - name: signing
    description: Signing key management

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  headers:
    ReferrerPolicy:
      description: Prevents referrer leakage.
      schema:
        type: string
        enum: [no-referrer]
    XContentTypeOptions:
      description: Prevents MIME-type sniffing.
      schema:
        type: string
        enum: [nosniff]
    XFrameOptions:
      description: Prevents clickjacking by disabling framing.
      schema:
        type: string
        enum: [DENY]
    StrictTransportSecurity:
      description: Enforces HTTPS connections.
      schema:
        type: string
        pattern: '^max-age=\d+'
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer

  schemas:
    CaptureId:
      type: string
      pattern: '^cap_[a-f0-9]{32}$'
      description: Unique capture identifier. Also serves as the access secret for per-capture access.
      examples:
        - cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6

    ProblemDetail:
      type: object
      description: RFC 9457 problem response.
      required: [type, status, title, detail]
      properties:
        type:
          type: string
          const: about:blank
          description: Always "about:blank". Clients should switch on `status`, not `type`.
        status:
          type: integer
          description: HTTP status code.
        title:
          type: string
          description: Short, human-readable summary of the problem class.
        detail:
          type: string
          description: Human-readable explanation of this specific occurrence.

    CaptureAccepted:
      type: object
      description: Acknowledged capture request. The capture is queued; poll the status URL.
      required: [id, statusUrl, note]
      properties:
        id:
          $ref: '#/components/schemas/CaptureId'
        statusUrl:
          type: string
          format: uri
          description: Absolute URL to poll for capture status.
        note:
          type: string
          description: Advisory message about related API capabilities.

    CaptureStatus:
      type: object
      description: Current state of a capture. Fields depend on status value.
      required: [id, status]
      properties:
        id:
          $ref: '#/components/schemas/CaptureId'
        status:
          type: string
          enum: [pending, complete, failed]
          description: Lifecycle state of the capture.
        captureUrl:
          type: string
          format: uri
          description: Present when status is "complete". URL to retrieve capture metadata and artifact links.
        error:
          type: string
          description: Present when status is "failed". Human-readable failure reason.
        retryable:
          type: boolean
          description: Present when status is "failed". True if submitting a new capture may succeed.

    CaptureArtifacts:
      type: object
      description: >
        Named artifact URLs for a complete capture. All fields present for a
        complete capture except headers, which is absent if the HTTP header
        fetch failed or timed out. The html artifact is served as text/plain
        with Content-Disposition: attachment to prevent XSS -- do not embed
        in iframes or inject as HTML.
      required: [screenshot, html]
      properties:
        screenshot:
          type: string
          format: uri
          description: >
            Full-page PNG screenshot. Served via the API Worker with
            Content-Type: image/png and Content-Disposition: attachment.
          examples:
            - https://wrl.example.com/v1/captures/cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6/artifacts/screenshot
        html:
          type: string
          format: uri
          description: >
            Rendered HTML after JavaScript execution. Served as text/plain
            with Content-Disposition: attachment -- NOT as text/html -- to
            prevent stored XSS.
          examples:
            - https://wrl.example.com/v1/captures/cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6/artifacts/html
        headers:
          type: string
          format: uri
          description: >
            JSON object of HTTP response headers captured at fetch time.
            Set-Cookie values are redacted to [redacted]. Absent if the header
            fetch failed or timed out.
          examples:
            - https://wrl.example.com/v1/captures/cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6/artifacts/headers

    WaczInfo:
      type: object
      description: >
        WACZ bundle metadata. Present only when a signing key was configured and
        WACZ bundling succeeded. Absence does not indicate a capture failure --
        screenshot and html are always present for a complete capture.
      required: [url, bundleHash, size]
      properties:
        url:
          type: string
          format: uri
          description: >
            URL to the signed WACZ bundle. Served via the API Worker with
            Content-Type: application/wacz+zip and Content-Disposition: attachment.
          examples:
            - https://wrl.example.com/v1/captures/cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6/artifacts/wacz
        bundleHash:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
          description: >
            SHA-256 hash of the canonical JSON of the WACZ datapackage.json,
            in the form "sha256:{hex}". Use to verify bundle integrity.
          examples:
            - 'sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'
        size:
          type: integer
          minimum: 0
          description: Size of the WACZ bundle in bytes.
          examples:
            - 204800

    CaptureRecord:
      type: object
      description: >
        Metadata and artifact links for a completed capture. The capture ID acts
        as the access secret -- no authentication header is required. Captures are
        also accessible via GET /v1/captures.

        Artifact URLs are served via the API Worker to ensure correct security
        headers (XSS prevention for HTML artifact). URLs do not expire.

        To submit a new capture, see POST /v1/captures. For lifecycle tracking
        before completion, use GET /v1/captures/{captureId}/status.
      required: [id, status, url, createdAt, completedAt, artifacts]
      properties:
        id:
          $ref: '#/components/schemas/CaptureId'
        status:
          type: string
          const: complete
          description: Always "complete" -- this endpoint only returns completed captures.
        url:
          type: string
          format: uri
          description: The URL that was captured.
          examples:
            - https://example.com
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the capture was submitted.
          examples:
            - '2024-01-15T10:30:00.000Z'
        completedAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the capture completed.
          examples:
            - '2024-01-15T10:30:45.123Z'
        artifacts:
          $ref: '#/components/schemas/CaptureArtifacts'
        wacz:
          $ref: '#/components/schemas/WaczInfo'
          description: >
            WACZ bundle metadata. Present when status is "complete" AND a signing
            key was configured. Absent otherwise -- not an error condition.
        verifyUrl:
          type: string
          format: uri
          description: >
            URL to the human-readable verification page for this capture's WACZ bundle.
            Present only when `wacz` is present.
          examples:
            - https://wrl.example.com/v1/verify/cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6

    CaptureSummary:
      type: object
      description: >
        Abridged capture record returned by the list endpoint. Fields depend on
        status. Never includes ip, raw R2 keys (artifacts.* values, wacz.key),
        or other internal fields.

        Always present: id, status, url, createdAt.
        Additional fields when status is "complete": completedAt.
        Additional fields when status is "failed": failedAt, error, retryable.
        No additional fields when status is "pending".

        Note: only captures created after the list feature was deployed appear
        in results. Pre-deployment captures are not indexed.
      required: [id, status, url, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/CaptureId'
        status:
          type: string
          enum: [pending, complete, failed]
          description: Lifecycle state of the capture.
        url:
          type: string
          format: uri
          description: The URL that was captured.
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the capture was submitted.
        completedAt:
          type: string
          format: date-time
          description: Present when status is "complete". ISO 8601 timestamp when capture completed.
        failedAt:
          type: string
          format: date-time
          description: Present when status is "failed". ISO 8601 timestamp when capture failed.
        error:
          type: string
          description: Present when status is "failed". Human-readable failure reason.
        retryable:
          type: boolean
          description: Present when status is "failed". True if submitting a new capture may succeed.

    Pagination:
      type: object
      description: Cursor-based pagination metadata.
      required: [cursor, hasMore, limit]
      properties:
        cursor:
          type: ["string", "null"]
          description: >
            Opaque base64url string to pass as the `cursor` query parameter
            to retrieve the next page. Null when hasMore is false.
        hasMore:
          type: boolean
          description: True when additional results exist beyond the current page.
        limit:
          type: integer
          description: Effective page size used for this response.
          minimum: 1
          maximum: 100

    CaptureListResponse:
      type: object
      description: Paginated list of capture summaries.
      required: [data, pagination]
      properties:
        data:
          type: array
          description: Capture summaries for the current page. Empty array when no results; never null.
          items:
            $ref: '#/components/schemas/CaptureSummary'
        pagination:
          $ref: '#/components/schemas/Pagination'

    VerificationCheck:
      type: object
      description: Result of a single cryptographic check within a WACZ verification.
      required: [name, status]
      properties:
        name:
          type: string
          enum: [artifactHashes, bundleHash, signature]
          description: >
            Which check this result represents. artifactHashes verifies individual
            file integrity; bundleHash verifies the overall archive; signature
            verifies the Ed25519 signature over the bundle hash.
        status:
          type: string
          enum: [pass, fail, skip]
          description: >
            Outcome of the check. "skip" means the check was not performed because
            a prerequisite check failed.
        detail:
          type: string
          description: Human-readable failure reason. Present only when status is "fail" or "skip" with context.

    VerificationSigning:
      type: object
      description: >
        Cryptographic metadata extracted from the WACZ datapackage-digest.json.
        All fields are nullable -- they are absent when the digest document is
        missing or malformed. This object is informational only; the server's
        own public key is used for the verification decision, not the embedded publicKey.
      required: [bundleHash, signature, publicKey, signedAt]
      properties:
        bundleHash:
          type: ["string", "null"]
          description: SHA-256 hash of the canonical bundle, as recorded in signedData.hash.
        signature:
          type: ["string", "null"]
          description: Base64-encoded Ed25519 signature over the bundleHash bytes.
        publicKey:
          type: ["string", "null"]
          description: >
            Base64-encoded Ed25519 public key embedded in the WACZ. Informational
            only -- the server's key is used for actual verification.
        signedAt:
          type: ["string", "null"]
          description: ISO 8601 timestamp when the bundle was signed, from signedData.created.

    VerificationCapture:
      type: object
      description: Capture identity and timing metadata, extracted from the KV record.
      required: [id, createdAt, completedAt]
      properties:
        id:
          $ref: '#/components/schemas/CaptureId'
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the capture was submitted.
          examples:
            - '2024-01-15T10:30:00.000Z'
        completedAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the capture completed.
          examples:
            - '2024-01-15T10:30:45.123Z'

    VerificationResult:
      type: object
      description: >
        Full verification result for a capture's WACZ bundle. A 200 status does NOT
        mean the capture is verified -- check the `verified` field.
      required: [verified, capture, signing, checks]
      properties:
        verified:
          type: boolean
          description: True only when all three checks pass. False for any failure or skip.
        capture:
          $ref: '#/components/schemas/VerificationCapture'
        signing:
          description: >
            Cryptographic metadata from the WACZ digest document. Null when the
            WACZ bundle was not found in storage or the digest document is absent.
          oneOf:
            - $ref: '#/components/schemas/VerificationSigning'
            - type: "null"
        checks:
          type: array
          description: "Results of the three verification checks, always in order: artifactHashes, bundleHash, signature."
          items:
            $ref: '#/components/schemas/VerificationCheck'

  responses:
    Problem400:
      description: Bad request — missing or malformed body, missing `url` field, invalid URL scheme.
      headers:
        Referrer-Policy:
          $ref: '#/components/headers/ReferrerPolicy'
        X-Content-Type-Options:
          $ref: '#/components/headers/XContentTypeOptions'
        X-Frame-Options:
          $ref: '#/components/headers/XFrameOptions'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            missingBody:
              summary: No JSON body provided
              value: {type: about:blank, status: 400, title: Bad Request, detail: Request body is missing or not valid JSON.}
            missingUrl:
              summary: url field absent
              value: {type: about:blank, status: 400, title: Bad Request, detail: Request body must include a "url" field.}
            badScheme:
              summary: Non-http/https scheme
              value: {type: about:blank, status: 400, title: Bad Request, detail: "URL scheme 'ftp' is not allowed; use http or https"}

    Problem404:
      description: Not found.
      headers:
        Referrer-Policy:
          $ref: '#/components/headers/ReferrerPolicy'
        X-Content-Type-Options:
          $ref: '#/components/headers/XContentTypeOptions'
        X-Frame-Options:
          $ref: '#/components/headers/XFrameOptions'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        Cache-Control:
          description: Prevents caching of not-found responses.
          schema:
            type: string
            enum: ['no-store']
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            notFound:
              summary: Unknown resource ID
              value:
                type: about:blank
                status: 404
                title: Not Found
                detail: Capture not found.

    Problem401:
      description: Unauthorized — missing, malformed, or invalid Authorization header.
      headers:
        Referrer-Policy:
          $ref: '#/components/headers/ReferrerPolicy'
        X-Content-Type-Options:
          $ref: '#/components/headers/XContentTypeOptions'
        X-Frame-Options:
          $ref: '#/components/headers/XFrameOptions'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        WWW-Authenticate:
          description: Authentication challenge.
          schema:
            type: string
            enum: [Bearer]
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            missing:
              summary: No Authorization header
              value: {type: about:blank, status: 401, title: Unauthorized, detail: Authorization header is required.}

    Problem415:
      description: Unsupported Media Type — Content-Type is not application/json.
      headers:
        Referrer-Policy:
          $ref: '#/components/headers/ReferrerPolicy'
        X-Content-Type-Options:
          $ref: '#/components/headers/XContentTypeOptions'
        X-Frame-Options:
          $ref: '#/components/headers/XFrameOptions'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            wrongContentType:
              summary: Text/plain submitted instead of JSON
              value: {type: about:blank, status: 415, title: Unsupported Media Type, detail: Content-Type must be application/json.}

    Problem422:
      description: Unprocessable Content — private IP, embedded credentials, or double-encoded URL.
      headers:
        Referrer-Policy:
          $ref: '#/components/headers/ReferrerPolicy'
        X-Content-Type-Options:
          $ref: '#/components/headers/XContentTypeOptions'
        X-Frame-Options:
          $ref: '#/components/headers/XFrameOptions'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            privateIp:
              summary: URL resolves to a private address
              value: {type: about:blank, status: 422, title: Unprocessable Content, detail: Host resolves to a private IP address.}
            doubleEncoded:
              summary: Double-encoded characters in URL
              value: {type: about:blank, status: 422, title: Unprocessable Content, detail: URL contains double-encoded characters.}

    Problem429:
      description: Too Many Requests — rate limit exceeded.
      headers:
        Referrer-Policy:
          $ref: '#/components/headers/ReferrerPolicy'
        X-Content-Type-Options:
          $ref: '#/components/headers/XContentTypeOptions'
        X-Frame-Options:
          $ref: '#/components/headers/XFrameOptions'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            rateLimited:
              summary: Caller exceeded allowed request rate
              value: {type: about:blank, status: 429, title: Too Many Requests, detail: Rate limit exceeded. Try again in 60 seconds.}

    Problem503:
      description: Service Unavailable -- required configuration is missing or service is at capacity.
      headers:
        Referrer-Policy:
          $ref: '#/components/headers/ReferrerPolicy'
        X-Content-Type-Options:
          $ref: '#/components/headers/XContentTypeOptions'
        X-Frame-Options:
          $ref: '#/components/headers/XFrameOptions'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            misconfigured:
              summary: Service missing required environment configuration
              value: {type: about:blank, status: 503, title: Service Unavailable, detail: Service is not configured. Contact the operator.}

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      tags: [health]
      security: []
      responses:
        '200':
          description: Service is running.
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Frame-Options:
              $ref: '#/components/headers/XFrameOptions'
            Strict-Transport-Security:
              $ref: '#/components/headers/StrictTransportSecurity'
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
              examples:
                healthy:
                  value: {status: ok}

  /v1/captures:
    get:
      operationId: listCaptures
      summary: List captures
      description: >
        Returns a paginated list of captures for the authenticated tenant in ascending
        chronological order (oldest first). Only captures created after the list
        feature was deployed appear in results -- pre-deployment captures are not
        indexed and will not appear.

        Pagination is cursor-based. Pass the `cursor` value from the previous
        response's `pagination.cursor` field to retrieve the next page. An absent or
        null cursor means there are no further results.
      tags: [captures]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: >
            Number of results per page. Default 20. Values above 100 are silently
            clamped to 100. Values below 1 or non-integers return 400.
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: >
            Opaque pagination cursor from a previous response's
            `pagination.cursor` field. Omit to start from the beginning.
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, complete, failed]
          description: >
            Filter results to captures with this status. Omit to return all statuses.
      responses:
        '200':
          description: Paginated list of capture summaries. Returns empty data array when no captures exist.
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Frame-Options:
              $ref: '#/components/headers/XFrameOptions'
            Strict-Transport-Security:
              $ref: '#/components/headers/StrictTransportSecurity'
            Cache-Control:
              description: Prevents caching of tenant-scoped list responses.
              schema:
                type: string
                enum: ['private, no-store']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureListResponse'
              examples:
                empty:
                  summary: No captures exist yet
                  value:
                    data: []
                    pagination:
                      cursor: null
                      hasMore: false
                      limit: 20
                firstPage:
                  summary: First page with more results
                  value:
                    data:
                      - id: cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
                        status: complete
                        url: https://example.com
                        createdAt: '2024-01-15T10:30:00.000Z'
                        completedAt: '2024-01-15T10:30:45.123Z'
                    pagination:
                      cursor: eyJrdiI6Im9wYXF1ZS1rdC1jdXJzb3IifQ
                      hasMore: true
                      limit: 20
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '429':
          $ref: '#/components/responses/Problem429'
    post:
      operationId: createCapture
      summary: Submit a URL for capture
      description: >
        Enqueues a headless-browser capture of the given URL. Returns immediately with a capture
        ID; poll the status URL to determine when the capture is complete.
      tags: [captures]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  description: Public http or https URL to capture. Must not resolve to a private IP.
            examples:
              basic:
                summary: Capture a public page
                value: {url: 'https://example.com'}
      responses:
        '202':
          description: Capture accepted and queued.
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Frame-Options:
              $ref: '#/components/headers/XFrameOptions'
            Strict-Transport-Security:
              $ref: '#/components/headers/StrictTransportSecurity'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureAccepted'
              examples:
                accepted:
                  value:
                    id: cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
                    statusUrl: https://wrl.example.com/v1/captures/cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6/status
                    note: Use GET /v1/captures to list and search your captures.
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '415':
          $ref: '#/components/responses/Problem415'
        '422':
          $ref: '#/components/responses/Problem422'
        '429':
          $ref: '#/components/responses/Problem429'
        '503':
          $ref: '#/components/responses/Problem503'

  /v1/captures/{captureId}/status:
    get:
      operationId: getCaptureStatus
      summary: Poll capture status
      description: >
        Returns the current state of a capture. No authentication is required — the capture ID
        acts as the access secret. Poll until status is "complete" or "failed".
      tags: [captures]
      security: []
      parameters:
        - name: captureId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/CaptureId'
          description: Capture ID returned by POST /v1/captures.
      responses:
        '200':
          description: Capture found. Check `status` field for current state.
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Frame-Options:
              $ref: '#/components/headers/XFrameOptions'
            Strict-Transport-Security:
              $ref: '#/components/headers/StrictTransportSecurity'
            Cache-Control:
              description: Prevents caching of status responses.
              schema:
                type: string
                enum: ['private, no-store']
            Retry-After:
              description: Present when status is "pending". Suggested seconds before next poll.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureStatus'
              examples:
                pending:
                  summary: Capture is queued or in progress
                  value:
                    id: cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
                    status: pending
                complete:
                  summary: Capture finished successfully
                  value:
                    id: cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
                    status: complete
                    captureUrl: https://wrl.example.com/v1/captures/cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
                failed:
                  summary: Capture failed with a retryable error
                  value:
                    id: cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
                    status: failed
                    error: Page did not finish loading within 25 seconds.
                    retryable: true
        '404':
          $ref: '#/components/responses/Problem404'

  /v1/captures/{captureId}:
    get:
      operationId: getCapture
      summary: Retrieve a completed capture
      description: >
        Returns metadata and artifact links for a completed capture. The capture ID acts
        as the access secret -- no authentication header is required.
        Returns 404 if the capture does not exist or has not yet completed.
      tags: [captures]
      security: []
      parameters:
        - name: captureId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/CaptureId'
          description: Capture ID returned by POST /v1/captures.
      responses:
        '200':
          description: Capture found and complete.
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Frame-Options:
              $ref: '#/components/headers/XFrameOptions'
            Strict-Transport-Security:
              $ref: '#/components/headers/StrictTransportSecurity'
            Cache-Control:
              description: Prevents caching of capture records.
              schema:
                type: string
                enum: ['private, no-store']
            Access-Control-Allow-Origin:
              description: Allows cross-origin access to capture records.
              schema:
                type: string
                enum: ['*']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureRecord'
              examples:
                withWacz:
                  summary: Completed capture with WACZ bundle
                  value:
                    id: cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
                    status: complete
                    url: https://example.com
                    createdAt: '2024-01-15T10:30:00.000Z'
                    completedAt: '2024-01-15T10:30:45.123Z'
                    artifacts:
                      screenshot: https://wrl.example.com/v1/captures/cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6/artifacts/screenshot
                      html: https://wrl.example.com/v1/captures/cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6/artifacts/html
                      headers: https://wrl.example.com/v1/captures/cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6/artifacts/headers
                    wacz:
                      url: https://wrl.example.com/v1/captures/cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6/artifacts/wacz
                      bundleHash: 'sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'
                      size: 204800
                    verifyUrl: https://wrl.example.com/v1/verify/cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
                withoutWacz:
                  summary: Completed capture without WACZ bundle
                  value:
                    id: cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
                    status: complete
                    url: https://example.com
                    createdAt: '2024-01-15T10:30:00.000Z'
                    completedAt: '2024-01-15T10:30:45.123Z'
                    artifacts:
                      screenshot: https://wrl.example.com/v1/captures/cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6/artifacts/screenshot
                      html: https://wrl.example.com/v1/captures/cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6/artifacts/html
                      headers: https://wrl.example.com/v1/captures/cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6/artifacts/headers
        '404':
          $ref: '#/components/responses/Problem404'

  /v1/captures/{captureId}/artifacts/{name}:
    get:
      operationId: getCaptureArtifact
      summary: Download a capture artifact
      description: >
        Returns the raw artifact binary or text for a completed capture. The capture ID acts
        as the access secret -- no authentication header is required.
        Responses include Content-Disposition: attachment to prevent browser rendering.
      tags: [captures]
      security: []
      parameters:
        - name: captureId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/CaptureId'
          description: Capture ID returned by POST /v1/captures.
        - name: name
          in: path
          required: true
          schema:
            type: string
            enum: [screenshot, html, headers, wacz]
          description: Artifact name to retrieve.
      responses:
        '200':
          description: Artifact found. Content-Type depends on artifact name.
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Frame-Options:
              $ref: '#/components/headers/XFrameOptions'
            Strict-Transport-Security:
              $ref: '#/components/headers/StrictTransportSecurity'
            Content-Disposition:
              description: Always "attachment" to prevent browser rendering.
              schema:
                type: string
            Cache-Control:
              description: Artifacts are immutable; aggressively cached.
              schema:
                type: string
                enum: ['public, max-age=31536000, immutable']
            Access-Control-Allow-Origin:
              description: Allows cross-origin access to artifact downloads.
              schema:
                type: string
                enum: ['*']
          content:
            image/png:
              schema:
                type: string
                format: binary
                description: PNG screenshot (artifact name "screenshot").
            text/plain:
              schema:
                type: string
                description: Rendered HTML served as plain text (artifact name "html").
            application/json:
              schema:
                type: object
                description: HTTP response headers as a JSON object (artifact name "headers").
                additionalProperties:
                  type: string
            application/wacz+zip:
              schema:
                type: string
                format: binary
                description: Signed WACZ bundle (artifact name "wacz").
        '404':
          $ref: '#/components/responses/Problem404'

  /v1/verify/{captureId}:
    get:
      operationId: verifyCapture
      summary: Verify a capture's WACZ bundle
      description: >
        Performs cryptographic verification of the WACZ bundle for a completed capture
        and returns the result. No authentication required.

        Content negotiation: browsers (Accept: text/html) receive a self-contained
        HTML verification page that fetches the JSON result client-side. API clients
        receive JSON directly.

        **A 200 status does NOT mean the capture is verified -- check the `verified` field.**
        The endpoint returns 200 for all reachable captures, even when verification fails.
      tags: [verification]
      security: []
      parameters:
        - name: captureId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/CaptureId'
          description: Capture ID to verify.
      responses:
        '200':
          description: >
            Verification result. Check the `verified` boolean field -- a 200 status
            does not mean the capture passed verification.
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Frame-Options:
              $ref: '#/components/headers/XFrameOptions'
            Strict-Transport-Security:
              $ref: '#/components/headers/StrictTransportSecurity'
            Cache-Control:
              description: >
                "public, max-age=86400, stale-while-revalidate=604800" for verified captures;
                "no-store" for non-verified captures.
              schema:
                type: string
            Access-Control-Allow-Origin:
              description: Allows cross-origin access to verification results.
              schema:
                type: string
                enum: ['*']
            Vary:
              description: Response varies by Accept header (JSON vs HTML).
              schema:
                type: string
                enum: ['Accept']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResult'
              examples:
                verified:
                  summary: All three checks passed
                  value:
                    verified: true
                    capture:
                      id: cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
                      createdAt: '2024-01-15T10:30:00.000Z'
                      completedAt: '2024-01-15T10:30:45.123Z'
                    signing:
                      bundleHash: 'sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'
                      signature: 'base64encodedSignatureHere=='
                      publicKey: 'base64encodedPublicKeyHere='
                      signedAt: '2024-01-15T10:30:44.000Z'
                    checks:
                      - {name: artifactHashes, status: pass}
                      - {name: bundleHash, status: pass}
                      - {name: signature, status: pass}
                notVerified:
                  summary: Signature check failed
                  value:
                    verified: false
                    capture:
                      id: cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
                      createdAt: '2024-01-15T10:30:00.000Z'
                      completedAt: '2024-01-15T10:30:45.123Z'
                    signing:
                      bundleHash: 'sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'
                      signature: 'base64encodedSignatureHere=='
                      publicKey: 'base64encodedPublicKeyHere='
                      signedAt: '2024-01-15T10:30:44.000Z'
                    checks:
                      - {name: artifactHashes, status: pass}
                      - {name: bundleHash, status: pass}
                      - {name: signature, status: fail, detail: Ed25519 signature verification failed}
                bundleMissing:
                  summary: WACZ bundle not found in storage
                  value:
                    verified: false
                    capture:
                      id: cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
                      createdAt: '2024-01-15T10:30:00.000Z'
                      completedAt: '2024-01-15T10:30:45.123Z'
                    signing: null
                    checks:
                      - {name: artifactHashes, status: fail, detail: WACZ bundle not found in storage}
                      - {name: bundleHash, status: fail, detail: WACZ bundle not found in storage}
                      - {name: signature, status: fail, detail: WACZ bundle not found in storage}
            text/html:
              schema:
                type: string
                description: >
                  Self-contained HTML verification page. The page fetches the JSON result
                  client-side and renders a human-readable verification report with capture
                  metadata, check results, and a screenshot. Requires JavaScript; a
                  no-script fallback links to the JSON endpoint.
        '404':
          $ref: '#/components/responses/Problem404'
        '429':
          $ref: '#/components/responses/Problem429'
        '503':
          $ref: '#/components/responses/Problem503'

  /.well-known/signing-key:
    get:
      operationId: getSigningKey
      summary: Retrieve the service's Ed25519 public signing key
      description: >
        Returns the Ed25519 public key used to sign WACZ bundles. Clients can use
        this to independently verify bundle signatures without trusting the
        verification endpoint.
      tags: [signing]
      security: []
      responses:
        '200':
          description: Signing key available.
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Frame-Options:
              $ref: '#/components/headers/XFrameOptions'
            Strict-Transport-Security:
              $ref: '#/components/headers/StrictTransportSecurity'
            Cache-Control:
              description: Public key is stable; cached for one hour with a long stale window.
              schema:
                type: string
                enum: ['public, max-age=3600, stale-while-revalidate=86400']
            Access-Control-Allow-Origin:
              description: Allows cross-origin access to the public key.
              schema:
                type: string
                enum: ['*']
          content:
            application/json:
              schema:
                type: object
                description: The service's current Ed25519 public signing key.
                required: [algorithm, publicKey, keyId]
                additionalProperties: false
                properties:
                  algorithm:
                    type: string
                    const: Ed25519
                    description: Always "Ed25519".
                  publicKey:
                    type: string
                    description: Base64-encoded 32-byte Ed25519 public key.
                    examples:
                      - 'MCowBQYDK2VwAyEA...'
                  keyId:
                    type: string
                    pattern: '^[0-9a-f]{8}$'
                    description: >
                      Key fingerprint -- first 8 hex chars of SHA-256(raw public key bytes).
                      Used to identify which historical key signed a given WACZ bundle.
                    examples:
                      - 'a1b2c3d4'
              examples:
                signingKey:
                  summary: Service signing key
                  value:
                    algorithm: Ed25519
                    publicKey: 'MCowBQYDK2VwAyEA47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU='
                    keyId: 'a1b2c3d4'
        '429':
          $ref: '#/components/responses/Problem429'
        '503':
          $ref: '#/components/responses/Problem503'

  /.well-known/signing-keys:
    get:
      operationId: getSigningKeys
      summary: List all historical signing keys
      description: >
        Returns all Ed25519 public keys that have been used to sign WACZ bundles,
        including the current key. Third-party verifiers can use this to look up
        the correct key for a given WACZ bundle using the keyId field from
        signedData in the bundle's datapackage-digest.json.
      tags: [signing]
      security: []
      responses:
        '200':
          description: List of archived signing keys.
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Frame-Options:
              $ref: '#/components/headers/XFrameOptions'
            Strict-Transport-Security:
              $ref: '#/components/headers/StrictTransportSecurity'
            Cache-Control:
              description: Key list is stable; cached for one hour with a long stale window.
              schema:
                type: string
                enum: ['public, max-age=3600, stale-while-revalidate=86400']
            Access-Control-Allow-Origin:
              description: Allows cross-origin access.
              schema:
                type: string
                enum: ['*']
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                additionalProperties: false
                properties:
                  keys:
                    type: array
                    description: All historical signing keys, including the current one.
                    items:
                      type: object
                      required: [keyId, algorithm, publicKey, archivedAt]
                      additionalProperties: false
                      properties:
                        keyId:
                          type: string
                          pattern: '^[0-9a-f]{8}$'
                          description: Key fingerprint.
                        algorithm:
                          type: string
                          const: Ed25519
                        publicKey:
                          type: string
                          description: Base64-encoded 32-byte Ed25519 public key.
                        archivedAt:
                          type: string
                          format: date-time
                          description: ISO 8601 timestamp when the key was first archived.
        '429':
          $ref: '#/components/responses/Problem429'
