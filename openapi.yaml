paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      tags: [health]
      security: []
      responses:
        '200':
          description: Service is running.
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Frame-Options:
              $ref: '#/components/headers/XFrameOptions'
            Strict-Transport-Security:
              $ref: '#/components/headers/StrictTransportSecurity'
            Link:
              $ref: '#/components/headers/TermsLink'
          content:
            application/json:
              schema:
                type: object
                required: [status, legal]
                properties:
                  status:
                    type: string
                    const: ok
                  legal:
                    type: object
                    required: [terms, policy]
                    properties:
                      terms:
                        type: string
                        format: uri
                      policy:
                        type: string
                        format: uri
              examples:
                healthy:
                  value:
                    status: ok
                    legal:
                      terms: https://github.com/benpeter/web-resource-ledger/blob/main/TERMS.md
                      policy: https://github.com/benpeter/web-resource-ledger/blob/main/CONTENT-POLICY.md

  /v1/captures:
    options:
      operationId: preflightCaptures
      summary: CORS preflight for POST /v1/captures
      description: >
        Handles CORS preflight requests for POST /v1/captures. Returns 204 with
        appropriate CORS headers when the requesting origin matches the configured
        allowlist. CORS headers are absent when the origin is not allowed.
      tags: [captures]
      security: []
      responses:
        '204':
          description: Preflight accepted.
          headers:
            Access-Control-Allow-Origin:
              description: Echoes the requesting origin when it matches the configured allowlist.
              schema:
                type: string
            Access-Control-Allow-Methods:
              description: Allowed methods for cross-origin requests.
              schema:
                type: string
                enum: [POST]
            Access-Control-Allow-Headers:
              description: Allowed request headers for cross-origin requests.
              schema:
                type: string
                enum: ['Content-Type, Authorization']
            Access-Control-Max-Age:
              description: Seconds the preflight result may be cached.
              schema:
                type: integer
                example: 7200
            Vary:
              description: Indicates the response varies by Origin header.
              schema:
                type: string
                enum: [Origin]
            Cache-Control:
              description: Prevents caching of preflight responses.
              schema:
                type: string
                enum: [no-store]
    get:
      operationId: listCaptures
      summary: List captures
      description: >
        Returns a paginated list of captures for the authenticated tenant in
        descending chronological order (newest first by default). Supports
        filtering by status, URL prefix, and date range, with configurable
        sort order.

        Pagination is offset-based. Use `offset` and `limit` to navigate
        pages. The response includes a `total` count for the matched query.
      tags: [captures]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: >
            Number of results per page. Default 20. Values above 100 are silently
            clamped to 100. Values below 1 or non-integers return 400.
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
          description: >
            Zero-based offset for pagination. Default 0 (first page).
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, complete, failed]
          description: >
            Filter results to captures with this status. Omit to return all statuses.
        - name: url
          in: query
          required: false
          schema:
            type: string
            minLength: 4
            maxLength: 200
          description: >
            Filter by URL prefix match. Minimum 4 characters. Must not contain
            `%` or `_` wildcard characters. Returns captures whose URL starts
            with the given string.
        - name: created_after
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: >
            Filter to captures created at or after this ISO 8601 timestamp
            (inclusive). Use with `created_before` for date range queries.
        - name: created_before
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: >
            Filter to captures created before this ISO 8601 timestamp
            (exclusive). Must be after `created_after` if both are provided.
        - name: sort
          in: query
          required: false
          schema:
            type: string
            default: '-created_at'
            enum: [created_at, '-created_at']
          description: >
            Sort order. `-created_at` (default) for newest first,
            `created_at` for oldest first.
      responses:
        '200':
          description: Paginated list of capture summaries. Returns empty data array when no captures exist.
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Frame-Options:
              $ref: '#/components/headers/XFrameOptions'
            Strict-Transport-Security:
              $ref: '#/components/headers/StrictTransportSecurity'
            Link:
              $ref: '#/components/headers/TermsLink'
            Cache-Control:
              description: Prevents caching of tenant-scoped list responses.
              schema:
                type: string
                enum: ['private, no-store']
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureListResponse'
              examples:
                empty:
                  summary: No captures exist yet
                  value:
                    data: []
                    pagination:
                      total: 0
                      offset: 0
                      hasMore: false
                      limit: 20
                firstPage:
                  summary: First page with more results
                  value:
                    data:
                      - id: cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
                        status: complete
                        url: https://example.com
                        createdAt: '2024-01-15T10:30:00.000Z'
                        completedAt: '2024-01-15T10:30:45.123Z'
                        renderQuality: full
                    pagination:
                      total: 42
                      offset: 0
                      hasMore: true
                      limit: 20
                mixedStatuses:
                  summary: Page with pending, failed, and complete captures
                  value:
                    data:
                      - id: cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
                        status: complete
                        url: https://example.com
                        createdAt: '2024-01-15T10:30:00.000Z'
                        completedAt: '2024-01-15T10:30:45.123Z'
                      - id: cap_b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7
                        status: failed
                        url: https://slow-site.example.com
                        createdAt: '2024-01-15T11:00:00.000Z'
                        failedAt: '2024-01-15T11:00:30.000Z'
                        error: Page did not finish loading within 20 seconds
                        retryable: true
                      - id: cap_c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8
                        status: pending
                        url: https://another.example.com
                        createdAt: '2024-01-15T11:05:00.000Z'
                    pagination:
                      total: 3
                      offset: 0
                      hasMore: false
                      limit: 20
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          description: Internal Server Error — database read failed.
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Frame-Options:
              $ref: '#/components/headers/XFrameOptions'
            Strict-Transport-Security:
              $ref: '#/components/headers/StrictTransportSecurity'
            Link:
              $ref: '#/components/headers/TermsLink'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                dbError:
                  summary: Database read failed
                  value: {type: about:blank, status: 500, title: Internal Server Error, detail: Could not list captures}
        '503':
          $ref: '#/components/responses/Problem503'
    post:
      operationId: createCapture
      summary: Submit a URL for capture
      description: >
        Enqueues a headless-browser capture of the given URL. Returns immediately with a capture
        ID; poll the status URL to determine when the capture is complete.

        CORS: This endpoint supports cross-origin requests from allowed origins. Preflight
        (OPTIONS) is handled automatically. Configure allowed origins via the CORS_ORIGINS
        environment variable.
      tags: [captures]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  description: Public http or https URL to capture. Must not resolve to a private IP.
            examples:
              basic:
                summary: Capture a public page
                value: {url: 'https://example.com'}
      responses:
        '202':
          description: Capture accepted and queued.
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Frame-Options:
              $ref: '#/components/headers/XFrameOptions'
            Strict-Transport-Security:
              $ref: '#/components/headers/StrictTransportSecurity'
            Link:
              $ref: '#/components/headers/TermsLink'
            Retry-After:
              description: Suggested seconds before polling capture status.
              schema:
                type: integer
                example: 5
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            Access-Control-Allow-Origin:
              description: Echoes the requesting origin when it matches the configured allowlist.
              schema:
                type: string
            Vary:
              description: Indicates the response varies by Origin header for CORS.
              schema:
                type: string
                enum: [Origin]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureAccepted'
              examples:
                accepted:
                  value:
                    id: cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
                    statusUrl: https://wrl.example.com/v1/captures/cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6/status
                    note: Use GET /v1/captures to list and search your captures.
        '400':
          description: Bad request — missing or malformed body, missing `url` field, invalid URL scheme.
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            X-Content-Type-Options:
