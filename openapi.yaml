                enum: ['private, no-store']
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    description: API key summaries. Empty array when no keys exist.
                    items:
                      $ref: '#/components/schemas/AdminKeySummary'
              examples:
