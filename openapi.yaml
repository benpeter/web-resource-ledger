openapi: 3.1.0
info:
  title: Web Resource Ledger API
  version: 0.5.0
  description: Capture web page screenshots, rendered HTML, and HTTP headers via headless Chromium.
  termsOfService: https://github.com/benpeter/web-resource-ledger/blob/main/TERMS.md
  license:
    name: Apache 2.0
    identifier: Apache-2.0

servers:
  - url: https://wrl.benpeter.workers.dev
    description: Production
  - url: https://wrl-staging.benpeter.workers.dev
    description: Staging

tags:
  - name: health
    description: Service health
  - name: captures
    description: Web page capture lifecycle
  - name: verification
    description: WACZ bundle cryptographic verification
  - name: signing
    description: Signing key management
  - name: admin
    description: API key management (admin-only)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Per-tenant API key. Obtained via POST /v1/admin/keys or, for legacy
        deployments, the static CAPTURE_API_KEY secret. Required for capture
        submission (POST /v1/captures) and capture listing (GET /v1/captures).
    adminAuth:
      type: http
      scheme: bearer
      description: >
        Admin infrastructure key. Set via wrangler secret put ADMIN_KEY.
        Grants access to key management endpoints. Does not grant tenant
        capture or read access.

  headers:
    ReferrerPolicy:
      description: Prevents referrer leakage.
      schema:
        type: string
        enum: [no-referrer]
    XContentTypeOptions:
      description: Prevents MIME-type sniffing.
      schema:
        type: string
        enum: [nosniff]
    XFrameOptions:
      description: Prevents clickjacking by disabling framing.
      schema:
        type: string
        enum: [DENY]
    StrictTransportSecurity:
      description: Enforces HTTPS connections and signals HSTS preload eligibility.
      schema:
        type: string
        pattern: '^max-age=\d+'
        example: 'max-age=63072000; includeSubDomains; preload'
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        example: 60
    XRateLimitLimit:
      description: >
        Maximum number of requests allowed per IP in the current rate-limit window.
        Present on all non-503 responses from rate-limited endpoints, including error responses.
      schema:
        type: integer
        minimum: 1
        examples:
          - 10
          - 60
    TermsLink:
      description: Link to Terms of Service per RFC 8288.
      schema:
        type: string
        example: '<https://github.com/benpeter/web-resource-ledger/blob/main/TERMS.md>; rel="terms-of-service"'

  schemas:
    CaptureId:
      type: string
      pattern: '^cap_[a-f0-9]{32}$'
      description: Unique capture identifier. Also serves as the access secret for per-capture access.
      examples:
        - cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6

    ConsentHandling:
      type: object
      description: Consent Management Platform (CMP) interaction metadata captured during a consent-aware capture.
      required: [library, libraryVersion, action, result]
      properties:
        library:
          type: string
          description: Name of the autoconsent library used.
        libraryVersion:
          type: string
          description: Version of the autoconsent library used.
        action:
          type: string
          enum: [optOut]
          description: Consent action attempted.
        result:
          type: string
          enum: [success, notDetected, failed]
          description: Outcome of the consent action.
        cmpDetected:
          type: ["string", "null"]
          description: Name of the CMP detected, if any. Null when no CMP was found.

    CaptureSettings:
      type: object
      description: Settings and metadata about how the capture was performed.
      required: [version]
      properties:
        version:
          type: integer
          description: Schema version for captureSettings.
        consent:
          $ref: '#/components/schemas/ConsentHandling'
          description: Consent handling metadata. Present when consent opt-out was attempted.

    ProblemDetail:
      type: object
      description: RFC 9457 problem response.
      required: [type, status, title, detail]
      properties:
        type:
          type: string
          const: about:blank
          description: Always "about:blank". Clients should switch on `status`, not `type`.
        status:
          type: integer
          description: HTTP status code.
        title:
          type: string
          description: Short, human-readable summary of the problem class.
        detail:
          type: string
          description: Human-readable explanation of this specific occurrence.

    CaptureAccepted:
      type: object
      description: Acknowledged capture request. The capture is queued; poll the status URL.
      required: [id, statusUrl, note]
      properties:
        id:
          $ref: '#/components/schemas/CaptureId'
        statusUrl:
          type: string
          format: uri
          description: Absolute URL to poll for capture status.
        note:
          type: string
          description: Advisory message about related API capabilities.

    BatchCaptureRequest:
      type: object
      required: [urls]
      additionalProperties: false
      properties:
        urls:
          type: array
          description: >
            List of URLs to capture. Each item is an object with a url field.
            Maximum batch size is configurable (default 20, hard cap 100).
            Duplicate URLs are allowed — each gets its own capture ID.
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [url]
            properties:
              url:
                type: string
                format: uri
                description: Public http or https URL to capture. Must not resolve to a private IP.

    BatchCaptureItemSuccess:
      type: object
      required: [status, url, id, statusUrl]
      properties:
        status:
          type: integer
          const: 202
          description: HTTP status code for this item.
        url:
          type: string
          format: uri
          description: The validated/normalized URL.
        id:
          $ref: '#/components/schemas/CaptureId'
        statusUrl:
          type: string
          format: uri
          description: Absolute URL to poll for this capture's status.

    BatchCaptureItemError:
      type: object
      required: [status, url, error]
      properties:
        status:
          type: integer
          description: HTTP status code for this item (400, 422, 429, 500, 503).
        url:
          type: string
          description: The URL as submitted (raw input for errors, empty string for structural errors).
        error:
          $ref: '#/components/schemas/ProblemDetail'

    BatchCaptureSummary:
      type: object
      required: [total, accepted, failed]
      properties:
        total:
          type: integer
          minimum: 1
          description: Total number of items in the request.
        accepted:
          type: integer
          minimum: 0
          description: Number of items accepted for capture (status 202).
        failed:
          type: integer
          minimum: 0
          description: Number of items that failed validation or rate limiting.

    BatchCaptureResponse:
      type: object
      required: [items, summary]
      properties:
        items:
          type: array
          description: >
            Per-URL outcome in the same order as the input urls array.
            Length always equals the input array length.
          items:
            oneOf:
              - $ref: '#/components/schemas/BatchCaptureItemSuccess'
              - $ref: '#/components/schemas/BatchCaptureItemError'
        summary:
          $ref: '#/components/schemas/BatchCaptureSummary'

    CaptureStatus:
      type: object
      description: Current state of a capture. Fields depend on status value.
      required: [id, status]
      properties:
        id:
          $ref: '#/components/schemas/CaptureId'
        status:
          type: string
          enum: [pending, complete, failed]
          description: Lifecycle state of the capture.
        captureUrl:
          type: string
          format: uri
          description: Present when status is "complete". URL to retrieve capture metadata and artifact links.
        error:
          type: string
          description: Present when status is "failed". Human-readable failure reason.
        retryable:
          type: boolean
          description: Present when status is "failed". True if submitting a new capture may succeed.

    CaptureArtifacts:
      type: object
      description: >
        Named artifact URLs for a complete capture. All fields present for a
        complete capture except headers, which is absent if the HTTP header
        fetch failed or timed out. The html artifact is served as text/plain
        with Content-Disposition: attachment to prevent XSS -- do not embed
        in iframes or inject as HTML.

        The `screenshot` field always points to the best-available screenshot
        (backward compatible). `screenshotBefore` is the pre-consent-dismissal
        screenshot; present only when consent was detected and dismissed.
      required: [screenshot, html]
      properties:
        screenshot:
          type: string
          format: uri
          description: >
            Full-page PNG screenshot (best available). When consent was dismissed,
            this is the post-dismissal screenshot. Served via the API Worker with
            Content-Type: image/png and Content-Disposition: attachment.
          examples:
            - https://wrl.example.com/v1/captures/cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6/artifacts/screenshot
        screenshotBefore:
          type: string
          format: uri
          description: >
            Pre-consent-dismissal screenshot. Present only when consent was detected
            and successfully dismissed. Corresponds to the page state before the CMP
            was closed. Served as image/png with Content-Disposition: attachment.
          examples:
            - https://wrl.example.com/v1/captures/cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6/artifacts/screenshot-before
        html:
          type: string
          format: uri
          description: >
            Rendered HTML after JavaScript execution. Served as text/plain
            with Content-Disposition: attachment -- NOT as text/html -- to
            prevent stored XSS.
          examples:
            - https://wrl.example.com/v1/captures/cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6/artifacts/html
        headers:
          type: string
          format: uri
          description: >
            JSON object of HTTP response headers captured at fetch time.
            Set-Cookie values are redacted to [redacted]. Absent if the header
            fetch failed or timed out.
          examples:
            - https://wrl.example.com/v1/captures/cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6/artifacts/headers

    WaczInfo:
      type: object
      description: >
        WACZ bundle metadata. Present only when a signing key was configured and
        WACZ bundling succeeded. Absence does not indicate a capture failure --
        screenshot and html are always present for a complete capture.
      required: [url, bundleHash, size]
      properties:
        url:
          type: string
          format: uri
          description: >
            URL to the signed WACZ bundle. Served via the API Worker with
            Content-Type: application/wacz+zip and Content-Disposition: attachment.
          examples:
            - https://wrl.example.com/v1/captures/cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6/artifacts/wacz
        bundleHash:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
          description: >
            SHA-256 hash of the canonical JSON of the WACZ datapackage.json,
            in the form "sha256:{hex}". Use to verify bundle integrity.
          examples:
            - 'sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'
        size:
          type: integer
          minimum: 0
          description: Size of the WACZ bundle in bytes.
          examples:
            - 204800

    RenderInfo:
      type: object
      description: >
        Rendering process metadata. Reports which browser readiness milestone was
        reached and whether the navigation timed out before reaching the target
        (load). Present on completed captures created after this feature;
        absent on earlier captures. When absent, the page reached the load
        milestone (consistent with renderQuality: full).
      required: [waitUntilReached, timedOut, durationMs]
      properties:
        waitUntilReached:
          type: string
          enum: [domcontentloaded, load, networkidle]
          description: >
            Highest browser readiness milestone confirmed before the page was
            captured. "load" means the load event fired (default for new captures).
            "networkidle" means fewer than two open network connections for 500ms
            (used by older captures -- retained in enum for backward compatibility).
            "domcontentloaded" means the DOM was parsed but some resources may
            still be loading.
        timedOut:
          type: boolean
          description: >
            True when the navigation did not reach the target milestone
            (load) within the timeout window. When true, renderQuality
            is "partial".
        durationMs:
          type: integer
          minimum: 0
          description: >
            Wall-clock milliseconds from navigation start to the point the page
            was captured (either at load + adaptive settle, or at timeout).
          examples:
            - 25012
        settleMs:
          type: integer
          minimum: 0
          description: >
            Wall-clock milliseconds spent in the post-load adaptive settle phase.
            Settle ends when in-flight requests drain (settleReason: idle) or the
            3s hard cap is reached (settleReason: cap). Absent on partial captures
            and captures created before this feature.
          examples:
            - 320
        settleReason:
          type: string
          enum: [idle, cap]
          description: >
            Why the settle phase ended. "idle" means all non-persistent in-flight
            requests completed within the quiescence window. "cap" means the 3s
            hard cap was reached before quiescence. Absent on partial captures
            and captures created before this feature.
        stages:
          $ref: '#/components/schemas/RenderStages'
          description: >
            Per-stage timing breakdown. Present on captures created after
            stage-level instrumentation was deployed. Absent on earlier captures.

    RenderStages:
      type: object
      description: >
        Per-stage wall-clock durations within the rendering pipeline. All
        properties are present on every instrumented capture. Null values
        indicate stages that were not executed (e.g., consent on partial
        captures). The sum of non-null stages approximates but does not
        exactly equal render.durationMs due to inter-stage overhead.
      required:
        - sessionAcquireMs
        - contextSetupMs
        - navigationMs
        - settleMs
        - consentMs
        - screenshotMs
        - contentMs
      properties:
        sessionAcquireMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Time in ms to acquire a browser session from the pool.
        contextSetupMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Time in ms to create BrowserContext, set up routes, and open a page.
        navigationMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Time in ms from page.goto() to the target milestone or timeout.
        settleMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Time in ms for the post-navigation settle delay. Null on partial captures.
        consentMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Time in ms for cookie consent detection and dismissal. Null on partial captures.
        screenshotMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: >
            Time in ms to capture screenshot(s). Includes before-consent and
            after-consent screenshots (two non-contiguous intervals summed).
        contentMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Time in ms to extract rendered HTML via page.content().

    CaptureRecord:
      type: object
      description: >
        Metadata and artifact links for a completed capture. The capture ID acts
        as the access secret -- no authentication header is required. Captures are
        also accessible via GET /v1/captures.

        Artifact URLs are served via the API Worker to ensure correct security
        headers (XSS prevention for HTML artifact). URLs do not expire.

        To submit a new capture, see POST /v1/captures. For lifecycle tracking
        before completion, use GET /v1/captures/{captureId}/status.
      required: [id, status, url, createdAt, completedAt, renderQuality, artifacts]
      properties:
        id:
          $ref: '#/components/schemas/CaptureId'
        status:
          type: string
          const: complete
          description: Always "complete" -- this endpoint only returns completed captures.
        url:
          type: string
          format: uri
          description: The URL that was captured.
          examples:
            - https://example.com
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the capture was submitted.
          examples:
            - '2024-01-15T10:30:00.000Z'
        completedAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the capture completed.
          examples:
            - '2024-01-15T10:30:45.123Z'
        renderQuality:
          type: string
          enum: [full, partial]
          description: >
            Render quality of the capture. 'full' when the page reached the load
            milestone before capture (followed by an adaptive settle phase, up to
            3s). 'partial' when the capture was taken after a navigation timeout
            but DOMContentLoaded had fired. Defaults to 'full' for captures
            created before this feature.
        render:
          $ref: '#/components/schemas/RenderInfo'
          description: >
            Rendering process metadata. Present on captures created after this feature.
            When absent, the page reached the load milestone (consistent with renderQuality: full).
        artifacts:
          $ref: '#/components/schemas/CaptureArtifacts'
        wacz:
          $ref: '#/components/schemas/WaczInfo'
          description: >
            WACZ bundle metadata. Present when status is "complete" AND a signing
            key was configured. Absent otherwise -- not an error condition.
        verifyUrl:
          type: string
          format: uri
          description: >
            URL to the human-readable verification page for this capture's WACZ bundle.
            Present only when `wacz` is present. Omitted when the capture has no WACZ
            bundle (e.g., partial captures from navigation timeouts).
          examples:
            - https://wrl.example.com/v1/verify/cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
        captureSettings:
          $ref: '#/components/schemas/CaptureSettings'
          description: >
            Settings and metadata about how the capture was performed. Present when
            capture settings were recorded (e.g., consent handling was attempted).

    CaptureSummary:
      type: object
      description: >
        Abridged capture record returned by the list endpoint. Fields depend on
        status. Never includes ip, raw R2 keys (artifacts.* values, wacz.key),
        or other internal fields.

        Always present: id, status, url, createdAt.
        Additional fields when status is "complete": completedAt.
        Additional fields when status is "failed": failedAt, error, retryable.
        No additional fields when status is "pending".

        Note: only captures created after the list feature was deployed appear
        in results. Pre-deployment captures are not indexed.
      required: [id, status, url, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/CaptureId'
        status:
          type: string
          enum: [pending, complete, failed]
          description: Lifecycle state of the capture.
        url:
          type: string
          format: uri
          description: The URL that was captured.
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the capture was submitted.
        completedAt:
          type: string
          format: date-time
          description: Present when status is "complete". ISO 8601 timestamp when capture completed.
        renderQuality:
          type: string
          enum: [full, partial]
          description: >
            Present when status is "complete". Indicates whether the page fully rendered
            or was captured after a navigation timeout.
        failedAt:
          type: string
          format: date-time
          description: Present when status is "failed". ISO 8601 timestamp when capture failed.
        error:
          type: string
          description: Present when status is "failed". Human-readable failure reason.
        retryable:
          type: boolean
          description: Present when status is "failed". True if submitting a new capture may succeed.

    Pagination:
      type: object
      description: Offset-based pagination metadata.
      required: [total, offset, hasMore, limit]
      properties:
        total:
          type: integer
          description: Total number of results matching the query (before pagination).
          minimum: 0
        offset:
          type: integer
          description: Zero-based offset of the first result in this page.
          minimum: 0
        hasMore:
          type: boolean
          description: True when additional results exist beyond the current page.
        limit:
          type: integer
          description: Effective page size used for this response.
          minimum: 1
          maximum: 100

    CaptureListResponse:
      type: object
      description: Paginated list of capture summaries.
      required: [data, pagination]
      properties:
        data:
          type: array
          description: Capture summaries for the current page. Empty array when no results; never null.
          items:
            $ref: '#/components/schemas/CaptureSummary'
        pagination:
          $ref: '#/components/schemas/Pagination'

    AdminKeyCreateRequest:
      type: object
      description: Request body for creating a new API key.
      required: [tenantId, scopes, name]
      additionalProperties: false
      properties:
        tenantId:
          type: string
          pattern: '^[a-z0-9_-]{1,64}$'
          description: >
            Tenant this key belongs to. Must match /^[a-z0-9_-]{1,64}$/.
            Callers may use tenantId as a database key without additional sanitization.
          examples:
            - default
            - acme-corp
        scopes:
          type: array
          description: >
            Non-empty list of scopes to grant. Valid values: capture, read, admin.
            'capture' implies 'read'. 'admin' does NOT imply 'capture' or 'read'.
            Note: the 'admin' scope is reserved for a future migration from the
            ADMIN_KEY env var to per-tenant admin keys. It currently has
            no runtime effect on access control -- admin endpoints use ADMIN_KEY only.
          items:
            type: string
            enum: [capture, read, admin]
          minItems: 1
          examples:
            - [capture]
            - [capture, read]
        name:
          type: string
          description: >
            Human-readable label for the key. 1-128 characters using letters,
            digits, spaces, and _ . : - characters.
          minLength: 1
          maxLength: 128
          examples:
            - ci-pipeline
            - my-integration-key

    AdminKeyCreated:
      type: object
      description: >
        Response body when a new API key is created. The raw key is returned
        exactly once and cannot be retrieved again.
      required: [key, keyHash, tenantId, scopes, name, createdAt, warning]
      properties:
        key:
          type: string
          description: >
            Raw API key prefixed with "wrl_live_". Store this value now --
            it cannot be retrieved after this response.
          examples:
            - 'wrl_live_aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789abcdefghij'
        keyHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: SHA-256 hex digest of the raw key. Used as the database primary key and for revocation.
          examples:
            - 'a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6'
        tenantId:
          type: string
          description: Tenant this key belongs to.
          examples:
            - default
        scopes:
          type: array
          items:
            type: string
          description: Scopes granted to this key.
          examples:
            - [capture]
        name:
          type: string
          description: Human-readable label for the key.
          examples:
            - ci-pipeline
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the key was created.
          examples:
            - '2026-03-17T12:00:00.000Z'
        warning:
          type: string
          description: Always "Store this key now. It cannot be retrieved after this response."
          const: 'Store this key now. It cannot be retrieved after this response.'

    AdminKeySummary:
      type: object
      description: >
        API key summary returned by GET /v1/admin/keys. Never includes the raw key.
        Revoked keys include revoked=true and revokedAt fields.
      required: [keyHash, tenantId, scopes, name, createdAt, createdBy]
      properties:
        keyHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: SHA-256 hex digest of the raw key. Used as the identifier for revocation.
          examples:
            - 'a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6'
        tenantId:
          type: string
          description: Tenant this key belongs to.
          examples:
            - default
        scopes:
          type: array
          items:
            type: string
          description: Scopes granted to this key.
          examples:
            - [capture]
        name:
          type: string
          description: Human-readable label for the key.
          examples:
            - ci-pipeline
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the key was created.
        createdBy:
          type: string
          description: Who created the key. Currently always "admin".
          examples:
            - admin
        revoked:
          type: boolean
          description: Present and true when the key has been revoked.
        revokedAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the key was revoked. Present only when revoked is true.

    AdminKeyRevoked:
      type: object
      description: Response body when a key is revoked (or was already revoked -- idempotent).
      required: [keyHash, tenantId, scopes, name, createdAt, revoked, revokedAt]
      properties:
        keyHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: SHA-256 hex digest of the raw key.
        tenantId:
          type: string
          description: Tenant this key belonged to.
        scopes:
          type: array
          items:
            type: string
          description: Scopes the key had.
        name:
          type: string
          description: Human-readable label for the key.
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the key was created.
        revoked:
          type: boolean
          const: true
          description: Always true in this response.
        revokedAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the key was revoked.

    UsageResponse:
      type: object
      description: Per-tenant usage counters for a billing period.
      required: [tenantId, period, captureCount, storageBytes, apiCallCount, updatedAt]
      properties:
        tenantId:
          type: string
          description: Tenant identifier.
          example: default
        period:
          type: string
          description: Billing period in YYYY-MM format.
          example: '2026-03'
        captureCount:
          type: integer
          description: Number of captures completed in this period.
          minimum: 0
          example: 42
        storageBytes:
          type: integer
          description: Total R2 storage bytes consumed by captures in this period.
          minimum: 0
          example: 157286400
        apiCallCount:
          type: integer
          description: Number of authenticated API calls in this period.
          minimum: 0
          example: 128
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Last time counters were updated. Null if no activity in the period.
          example: '2026-03-22T14:30:00.000Z'

    VerificationCheck:
      type: object
      description: Result of a single cryptographic check within a WACZ verification.
      required: [name, status]
      properties:
        name:
          type: string
          enum: [artifactHashes, bundleHash, signature, timestamp]
          description: >
            Which check this result represents. artifactHashes verifies individual
            file integrity; bundleHash verifies the overall archive; signature
            verifies the Ed25519 signature over the bundle hash; timestamp verifies
            the RFC 3161 independent timestamp when present (v0.2.0 bundles only).
        status:
          type: string
          enum: [pass, fail, skip]
          description: >
            Outcome of the check. "skip" means the check was not performed because
            a prerequisite check failed.
        detail:
          type: string
          description: Human-readable failure reason. Present only when status is "fail" or "skip" with context.

    VerificationSigning:
      type: object
      description: >
        Cryptographic metadata extracted from the WACZ datapackage-digest.json.
        All fields are nullable -- they are absent when the digest document is
        missing or malformed. This object is informational only; the server's
        own public key is used for the verification decision, not the embedded publicKey.
      required: [bundleHash, signature, publicKey, signedAt]
      properties:
        bundleHash:
          type: ["string", "null"]
          description: SHA-256 hash of the canonical bundle, as recorded in signedData.hash.
        signature:
          type: ["string", "null"]
          description: Base64-encoded Ed25519 signature over the bundleHash bytes.
        publicKey:
          type: ["string", "null"]
          description: >
            Base64-encoded Ed25519 public key embedded in the WACZ. Informational
            only -- the server's key is used for actual verification.
        signedAt:
          type: ["string", "null"]
          description: ISO 8601 timestamp when the bundle was signed, from signedData.created.
        timestamp:
          type: ["object", "null"]
          description: >
            RFC 3161 timestamp data when an independent timestamp was obtained.
            Null or absent when no timestamp exists (legacy captures or TSA unavailable).
          properties:
            genTime:
              type: string
              format: date-time
              description: Time recorded by the TSA.
            tsa:
              type: string
              description: TSA endpoint URL.

    VerificationCapture:
      type: object
      description: Capture identity and timing metadata, extracted from the database record.
      required: [id, createdAt, completedAt]
      properties:
        id:
          $ref: '#/components/schemas/CaptureId'
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the capture was submitted.
          examples:
            - '2024-01-15T10:30:00.000Z'
        completedAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the capture completed.
          examples:
            - '2024-01-15T10:30:45.123Z'
        renderQuality:
          type: string
          enum: [full, partial]
          description: Render quality of the verified capture.

    VerificationResult:
      type: object
      description: >
        Full verification result for a capture's WACZ bundle. A 200 status does NOT
        mean the capture is verified -- check the `verified` field.
      required: [verified, capture, signing, checks]
      properties:
        verified:
          type: boolean
          description: True only when all checks pass or skip. False for any failure.
        capture:
          $ref: '#/components/schemas/VerificationCapture'
        signing:
          description: >
            Cryptographic metadata from the WACZ digest document. Null when the
            WACZ bundle was not found in storage or the digest document is absent.
          oneOf:
            - $ref: '#/components/schemas/VerificationSigning'
            - type: "null"
        checks:
          type: array
          description: >
            Verification check results, always in order: artifactHashes, bundleHash, signature,
            and (for v0.2.0 bundles) timestamp. Legacy v0.1.0 bundles produce three checks;
            v0.2.0 bundles produce up to four.
          items:
            $ref: '#/components/schemas/VerificationCheck'
        captureSettings:
          $ref: '#/components/schemas/CaptureSettings'
          description: >
            Settings and metadata about how the capture was performed. Present when
            capture settings were recorded.

  responses:
    Problem400:
