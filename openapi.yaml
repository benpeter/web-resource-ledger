  /v1/captures/batch:
    post:
      operationId: batchCapture
      summary: Submit multiple URLs for capture
      description: >
        Enqueues headless-browser captures for a list of URLs in a single request.
        Designed for bulk archival use cases: legal holds, compliance monitoring,
        CI pipelines that need to snapshot multiple pages simultaneously.

        Each URL is validated and rate-limited independently. A URL that fails
        validation or hits a per-item rate limit does not affect other items in
        the batch. Rate-limit tokens are consumed per URL, not per request.

        The response is always 207 Multi-Status when the batch structure itself
        is valid (non-empty urls array, within size limits). Top-level 400, 401,
        429, and 503 are returned when the entire request cannot be processed
        (auth failure, pre-flight rate limit, service at capacity, or the batch
        structure is invalid). This endpoint is server-to-server only — no CORS
        headers are emitted.
      tags: [captures]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCaptureRequest'
            examples:
              twoUrls:
                summary: Capture two URLs
                value:
                  urls:
                    - url: https://example.com
                    - url: https://example.org/page
      responses:
        '207':
          description: >
            Multi-Status. Returned when the batch structure is valid. Each item
            in `items` corresponds to the URL at the same index in the request.
            Check each item's `status` field — 202 means accepted, 4xx/5xx
            means that item failed. The summary counts accepted vs failed items.
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Frame-Options:
              $ref: '#/components/headers/XFrameOptions'
            Strict-Transport-Security:
              $ref: '#/components/headers/StrictTransportSecurity'
            Link:
              $ref: '#/components/headers/TermsLink'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchCaptureResponse'
              examples:
                allAccepted:
                  summary: All URLs accepted for capture
                  value:
                    items:
                      - status: 202
                        url: https://example.com
                        id: cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
                        statusUrl: https://wrl.example.com/v1/captures/cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6/status
                      - status: 202
                        url: https://example.org/page
                        id: cap_b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7
                        statusUrl: https://wrl.example.com/v1/captures/cap_b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7/status
                    summary:
                      total: 2
                      accepted: 2
                      failed: 0
                mixedResults:
                  summary: Mixed success and failure
                  value:
                    items:
                      - status: 202
                        url: https://example.com
                        id: cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
                        statusUrl: https://wrl.example.com/v1/captures/cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6/status
                      - status: 422
                        url: https://10.0.0.1
                        error:
                          type: about:blank
                          status: 422
                          title: Unprocessable Content
                          detail: Host resolves to a private IP address
                    summary:
                      total: 2
                      accepted: 1
                      failed: 1
        '400':
          description: >
            Bad request — invalid batch structure (missing urls field, empty array,
            batch size exceeds configured maximum, or malformed JSON body).
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Frame-Options:
              $ref: '#/components/headers/XFrameOptions'
            Strict-Transport-Security:
              $ref: '#/components/headers/StrictTransportSecurity'
            Link:
              $ref: '#/components/headers/TermsLink'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                emptyUrls:
                  summary: Empty urls array
                  value: {type: about:blank, status: 400, title: Bad Request, detail: "Field 'urls' must contain at least one item"}
                batchTooLarge:
                  summary: Batch size exceeds limit
                  value: {type: about:blank, status: 400, title: Bad Request, detail: "Batch size exceeds the maximum of 20 items"}
        '401':
          description: Unauthorized — missing, malformed, or invalid Authorization header.
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Frame-Options:
              $ref: '#/components/headers/XFrameOptions'
            Strict-Transport-Security:
              $ref: '#/components/headers/StrictTransportSecurity'
            Link:
              $ref: '#/components/headers/TermsLink'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            WWW-Authenticate:
              description: Authentication challenge.
              schema:
                type: string
                enum: [Bearer]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                missing:
                  summary: No Authorization header
                  value: {type: about:blank, status: 401, title: Unauthorized, detail: Authorization header is required.}
        '415':
          description: Unsupported Media Type — Content-Type is not application/json.
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Frame-Options:
              $ref: '#/components/headers/XFrameOptions'
            Strict-Transport-Security:
              $ref: '#/components/headers/StrictTransportSecurity'
            Link:
              $ref: '#/components/headers/TermsLink'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                wrongContentType:
                  summary: Text/plain submitted instead of JSON
                  value: {type: about:blank, status: 415, title: Unsupported Media Type, detail: Content-Type must be application/json}
        '429':
          description: Too Many Requests — pre-flight rate limit exceeded before any item was processed.
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Frame-Options:
              $ref: '#/components/headers/XFrameOptions'
            Strict-Transport-Security:
              $ref: '#/components/headers/StrictTransportSecurity'
            Link:
              $ref: '#/components/headers/TermsLink'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                rateLimited:
                  summary: Caller exceeded allowed request rate
                  value: {type: about:blank, status: 429, title: Too Many Requests, detail: Rate limit exceeded. Try again later.}
        '503':
          description: Service Unavailable — service is at capacity.
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Frame-Options:
              $ref: '#/components/headers/XFrameOptions'
            Strict-Transport-Security:
              $ref: '#/components/headers/StrictTransportSecurity'
            Link:
              $ref: '#/components/headers/TermsLink'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                atCapacity:
                  summary: Service is at capacity
                  value: {type: about:blank, status: 503, title: Service Unavailable, detail: Service is at capacity. Retry in 10 seconds.}

  /v1/captures/{captureId}/status:
    get:
      operationId: getCaptureStatus
      summary: Poll capture status
      description: >
        Returns the current state of a capture. No authentication is required — the capture ID
        acts as the access secret. Poll until status is "complete" or "failed".
      tags: [captures]
      security: []
      parameters:
        - name: captureId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/CaptureId'
          description: Capture ID returned by POST /v1/captures.
      responses:
        '200':
          description: Capture found. Check `status` field for current state.
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Frame-Options:
              $ref: '#/components/headers/XFrameOptions'
            Strict-Transport-Security:
              $ref: '#/components/headers/StrictTransportSecurity'
            Link:
              $ref: '#/components/headers/TermsLink'
            Cache-Control:
              description: Prevents caching of status responses.
              schema:
                type: string
                enum: ['private, no-store']
            Retry-After:
              description: Present when status is "pending". Suggested seconds before next poll.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureStatus'
              examples:
                pending:
                  summary: Capture is queued or in progress
                  value:
                    id: cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
                    status: pending
                complete:
                  summary: Capture finished successfully
                  value:
                    id: cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
                    status: complete
                    captureUrl: https://wrl.example.com/v1/captures/cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
                failed:
                  summary: Capture failed with a retryable error
                  value:
                    id: cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
                    status: failed
                    error: Page did not finish loading within 20 seconds
                    retryable: true
        '404':
          $ref: '#/components/responses/Problem404'

  /v1/captures/{captureId}:
    get:
      operationId: getCapture
      summary: Retrieve a completed capture
      description: >
        Returns metadata and artifact links for a completed capture. The capture ID acts
        as the access secret -- no authentication header is required.
        Returns 404 if the capture does not exist or has not yet completed.
      tags: [captures]
      security: []
      parameters:
        - name: captureId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/CaptureId'
          description: Capture ID returned by POST /v1/captures.
      responses:
        '200':
          description: Capture found and complete.
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Frame-Options:
              $ref: '#/components/headers/XFrameOptions'
            Strict-Transport-Security:
              $ref: '#/components/headers/StrictTransportSecurity'
            Link:
              $ref: '#/components/headers/TermsLink'
            Cache-Control:
              description: Prevents caching of capture records.
              schema:
                type: string
                enum: ['private, no-store']
            Access-Control-Allow-Origin:
              description: Allows cross-origin access to capture records.
              schema:
                type: string
                enum: ['*']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureRecord'
              examples:
                withWacz:
                  summary: Completed capture with WACZ bundle
                  value:
                    id: cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
                    status: complete
                    url: https://example.com
                    createdAt: '2024-01-15T10:30:00.000Z'
                    completedAt: '2024-01-15T10:30:45.123Z'
                    renderQuality: full
                    artifacts:
                      screenshot: https://wrl.example.com/v1/captures/cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6/artifacts/screenshot
                      html: https://wrl.example.com/v1/captures/cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6/artifacts/html
                      headers: https://wrl.example.com/v1/captures/cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6/artifacts/headers
                    wacz:
                      url: https://wrl.example.com/v1/captures/cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6/artifacts/wacz
                      bundleHash: 'sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'
                      size: 204800
                    verifyUrl: https://wrl.example.com/v1/verify/cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
                withoutWacz:
                  summary: Completed capture without WACZ bundle
                  value:
                    id: cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
                    status: complete
                    url: https://example.com
                    createdAt: '2024-01-15T10:30:00.000Z'
                    completedAt: '2024-01-15T10:30:45.123Z'
                    renderQuality: full
                    artifacts:
                      screenshot: https://wrl.example.com/v1/captures/cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6/artifacts/screenshot
                      html: https://wrl.example.com/v1/captures/cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6/artifacts/html
                      headers: https://wrl.example.com/v1/captures/cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6/artifacts/headers
                partialCapture:
                  summary: Partial capture after navigation timeout
                  value:
                    id: cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
                    status: complete
                    url: https://example.com
                    createdAt: '2024-01-15T10:30:00.000Z'
                    completedAt: '2024-01-15T10:30:45.123Z'
                    renderQuality: partial
                    render:
                      waitUntilReached: load
                      timedOut: true
                      durationMs: 20012
                    artifacts:
                      screenshot: https://wrl.example.com/v1/captures/cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6/artifacts/screenshot
                      html: https://wrl.example.com/v1/captures/cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6/artifacts/html
                      headers: https://wrl.example.com/v1/captures/cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6/artifacts/headers
        '404':
          $ref: '#/components/responses/Problem404'

  /v1/captures/{captureId}/artifacts/{name}:
    get:
      operationId: getCaptureArtifact
      summary: Download a capture artifact
      description: >
        Returns the raw artifact binary or text for a completed capture. The capture ID acts
        as the access secret -- no authentication header is required.
        Responses include Content-Disposition: attachment to prevent browser rendering.
      tags: [captures]
      security: []
      parameters:
        - name: captureId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/CaptureId'
          description: Capture ID returned by POST /v1/captures.
        - name: name
          in: path
          required: true
          schema:
            type: string
            enum: [screenshot-before, screenshot, html, headers, wacz]
          description: Artifact name to retrieve.
      responses:
        '200':
          description: Artifact found. Content-Type depends on artifact name.
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Frame-Options:
              $ref: '#/components/headers/XFrameOptions'
            Strict-Transport-Security:
              $ref: '#/components/headers/StrictTransportSecurity'
            Link:
              $ref: '#/components/headers/TermsLink'
            Content-Disposition:
              description: Always "attachment" to prevent browser rendering.
              schema:
                type: string
            Cache-Control:
              description: Artifacts are immutable; aggressively cached.
              schema:
                type: string
                enum: ['public, max-age=31536000, immutable']
            Access-Control-Allow-Origin:
              description: Allows cross-origin access to artifact downloads.
              schema:
                type: string
                enum: ['*']
          content:
            image/png:
              schema:
                type: string
                format: binary
                description: PNG screenshot (artifact name "screenshot").
            text/plain:
              schema:
                type: string
                description: Rendered HTML served as plain text (artifact name "html").
            application/json:
              schema:
                type: object
                description: HTTP response headers as a JSON object (artifact name "headers").
                additionalProperties:
                  type: string
            application/wacz+zip:
              schema:
                type: string
                format: binary
                description: Signed WACZ bundle (artifact name "wacz").
        '404':
          $ref: '#/components/responses/Problem404'

  /v1/verify/{captureId}:
    get:
      operationId: verifyCapture
      summary: Verify a capture's WACZ bundle
      description: >
        Performs cryptographic verification of the WACZ bundle for a completed capture
        and returns the result. No authentication required.

        Verification runs up to four checks: artifactHashes, bundleHash, signature,
        and (for v0.2.0 bundles) timestamp. The timestamp check verifies an RFC 3161
        independent timestamp against the bundle hash. Legacy v0.1.0 bundles produce
        three checks; the timestamp check is absent.

        Content negotiation: browsers (Accept: text/html) receive a self-contained
        HTML verification page that fetches the JSON result client-side. API clients
        receive JSON directly.

        **A 200 status does NOT mean the capture is verified -- check the `verified` field.**
        The endpoint returns 200 for all reachable captures, even when verification fails.

        Captures without a WACZ bundle (including partial captures from navigation
        timeouts) return 404 from this endpoint.
      tags: [verification]
      security: []
      parameters:
        - name: captureId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/CaptureId'
          description: Capture ID to verify.
      responses:
        '200':
          description: >
            Verification result. Check the `verified` boolean field -- a 200 status
            does not mean the capture passed verification.
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Frame-Options:
              $ref: '#/components/headers/XFrameOptions'
            Strict-Transport-Security:
              $ref: '#/components/headers/StrictTransportSecurity'
            Link:
              $ref: '#/components/headers/TermsLink'
            Cache-Control:
              description: >
                "public, max-age=86400, stale-while-revalidate=604800" for verified captures;
                "no-store" for non-verified captures.
              schema:
                type: string
            Access-Control-Allow-Origin:
              description: Allows cross-origin access to verification results.
              schema:
                type: string
                enum: ['*']
            Vary:
              description: Response varies by Accept header (JSON vs HTML).
              schema:
                type: string
                enum: ['Accept']
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResult'
              examples:
                verified:
                  summary: All four checks passed (v0.2.0 bundle with timestamp)
                  value:
                    verified: true
                    capture:
                      id: cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
                      createdAt: '2024-01-15T10:30:00.000Z'
                      completedAt: '2024-01-15T10:30:45.123Z'
                      renderQuality: full
                    signing:
                      bundleHash: 'sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'
                      signature: 'base64encodedSignatureHere=='
                      publicKey: 'base64encodedPublicKeyHere='
                      signedAt: '2024-01-15T10:30:44.000Z'
                      timestamp:
                        genTime: '2024-01-15T10:30:46.000Z'
                        tsa: 'https://freetsa.org/tsr'
                    checks:
                      - {name: artifactHashes, status: pass}
                      - {name: bundleHash, status: pass}
                      - {name: signature, status: pass}
                      - {name: timestamp, status: pass}
                verifiedLegacy:
                  summary: All three checks passed (v0.1.0 legacy bundle, no timestamp)
                  value:
                    verified: true
                    capture:
                      id: cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
                      createdAt: '2024-01-15T10:30:00.000Z'
                      completedAt: '2024-01-15T10:30:45.123Z'
                      renderQuality: full
                    signing:
                      bundleHash: 'sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'
                      signature: 'base64encodedSignatureHere=='
                      publicKey: 'base64encodedPublicKeyHere='
                      signedAt: '2024-01-15T10:30:44.000Z'
                      timestamp: null
                    checks:
                      - {name: artifactHashes, status: pass}
                      - {name: bundleHash, status: pass}
                      - {name: signature, status: pass}
                notVerified:
                  summary: Signature check failed
                  value:
                    verified: false
                    capture:
                      id: cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
                      createdAt: '2024-01-15T10:30:00.000Z'
                      completedAt: '2024-01-15T10:30:45.123Z'
                      renderQuality: full
                    signing:
                      bundleHash: 'sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'
                      signature: 'base64encodedSignatureHere=='
                      publicKey: 'base64encodedPublicKeyHere='
                      signedAt: '2024-01-15T10:30:44.000Z'
                    checks:
                      - {name: artifactHashes, status: pass}
                      - {name: bundleHash, status: pass}
                      - {name: signature, status: fail, detail: Ed25519 signature verification failed}
                bundleMissing:
                  summary: WACZ bundle not found in storage
                  value:
                    verified: false
                    capture:
                      id: cap_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
                      createdAt: '2024-01-15T10:30:00.000Z'
                      completedAt: '2024-01-15T10:30:45.123Z'
                    signing: null
                    checks:
                      - {name: artifactHashes, status: fail, detail: WACZ bundle not found in storage}
                      - {name: bundleHash, status: fail, detail: WACZ bundle not found in storage}
                      - {name: signature, status: fail, detail: WACZ bundle not found in storage}
            text/html:
              schema:
                type: string
                description: >
                  Self-contained HTML verification page. The page fetches the JSON result
                  client-side and renders a human-readable verification report with capture
                  metadata, check results, and a screenshot. Requires JavaScript; a
                  no-script fallback links to the JSON endpoint.
        '404':
          $ref: '#/components/responses/Problem404'
        '422':
          description: Unprocessable Content — WACZ bundle exceeds maximum verifiable size.
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Frame-Options:
              $ref: '#/components/headers/XFrameOptions'
            Strict-Transport-Security:
              $ref: '#/components/headers/StrictTransportSecurity'
            Link:
              $ref: '#/components/headers/TermsLink'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                bundleTooLarge:
                  summary: WACZ bundle exceeds 100 MB limit
                  value: {type: about:blank, status: 422, title: Unprocessable Content, detail: WACZ bundle exceeds maximum verifiable size}
        '429':
          $ref: '#/components/responses/Problem429'
        '503':
          $ref: '#/components/responses/Problem503'

  /.well-known/signing-key:
    get:
      operationId: getSigningKey
      summary: Retrieve the service's Ed25519 public signing key
      description: >
        Returns the Ed25519 public key used to sign WACZ bundles. Clients can use
        this to independently verify bundle signatures without trusting the
        verification endpoint.
      tags: [signing]
      security: []
      responses:
        '200':
          description: Signing key available.
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Frame-Options:
              $ref: '#/components/headers/XFrameOptions'
            Strict-Transport-Security:
              $ref: '#/components/headers/StrictTransportSecurity'
            Link:
              $ref: '#/components/headers/TermsLink'
            Cache-Control:
              description: Public key is stable; cached for one hour with a long stale window.
              schema:
                type: string
                enum: ['public, max-age=3600, stale-while-revalidate=86400']
            Access-Control-Allow-Origin:
              description: Allows cross-origin access to the public key.
              schema:
                type: string
                enum: ['*']
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
          content:
            application/json:
              schema:
                type: object
                description: The service's current Ed25519 public signing key.
                required: [algorithm, publicKey, keyId]
                additionalProperties: false
                properties:
                  algorithm:
                    type: string
                    const: Ed25519
                    description: Always "Ed25519".
                  publicKey:
                    type: string
                    description: Base64-encoded 32-byte Ed25519 public key.
                    examples:
                      - 'MCowBQYDK2VwAyEA...'
                  keyId:
                    type: string
                    pattern: '^[0-9a-f]{8}$'
                    description: >
                      Key fingerprint -- first 8 hex chars of SHA-256(raw public key bytes).
                      Used to identify which historical key signed a given WACZ bundle.
                    examples:
                      - 'a1b2c3d4'
              examples:
                signingKey:
                  summary: Service signing key
                  value:
                    algorithm: Ed25519
                    publicKey: 'MCowBQYDK2VwAyEA47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU='
                    keyId: 'a1b2c3d4'
        '429':
          $ref: '#/components/responses/Problem429'
        '503':
          $ref: '#/components/responses/Problem503'

  /.well-known/signing-keys:
    get:
      operationId: getSigningKeys
      summary: List all historical signing keys
      description: >
        Returns all Ed25519 public keys that have been used to sign WACZ bundles,
        including the current key. Third-party verifiers can use this to look up
        the correct key for a given WACZ bundle using the keyId field from
        signedData in the bundle's datapackage-digest.json.
      tags: [signing]
      security: []
      responses:
        '200':
          description: List of archived signing keys.
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Frame-Options:
              $ref: '#/components/headers/XFrameOptions'
            Strict-Transport-Security:
              $ref: '#/components/headers/StrictTransportSecurity'
            Link:
              $ref: '#/components/headers/TermsLink'
            Cache-Control:
              description: Key list is stable; cached for one hour with a long stale window.
              schema:
                type: string
                enum: ['public, max-age=3600, stale-while-revalidate=86400']
            Access-Control-Allow-Origin:
              description: Allows cross-origin access.
              schema:
                type: string
                enum: ['*']
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                additionalProperties: false
                properties:
                  keys:
                    type: array
                    description: All historical signing keys, including the current one.
                    items:
                      type: object
                      required: [keyId, algorithm, publicKey, archivedAt]
                      additionalProperties: false
                      properties:
                        keyId:
                          type: string
                          pattern: '^[0-9a-f]{8}$'
                          description: Key fingerprint.
                        algorithm:
                          type: string
                          const: Ed25519
                        publicKey:
                          type: string
                          description: Base64-encoded 32-byte Ed25519 public key.
                        archivedAt:
                          type: string
                          format: date-time
                          description: ISO 8601 timestamp when the key was first archived.
        '429':
          $ref: '#/components/responses/Problem429'
        '503':
          $ref: '#/components/responses/Problem503'

  /v1/admin/keys:
    post:
      operationId: adminCreateKey
      summary: Create a new API key
      description: >
        Creates a new per-tenant API key and returns the raw key exactly once.
        Store the returned key immediately -- it cannot be retrieved after this response.

        Rate limited to 5 requests per 60 seconds per IP. Auth check happens after rate limit.

        ```bash
        curl -X POST https://wrl.example.com/v1/admin/keys \
          -H "Authorization: Bearer $ADMIN_KEY" \
          -H "Content-Type: application/json" \
          -d '{"tenantId": "default", "scopes": ["capture"], "name": "ci-pipeline"}' | jq .
        ```

        Save the key:
        ```bash
        curl ... | jq -r .key > /tmp/wrl-key-default.txt
        ```
      tags: [admin]
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminKeyCreateRequest'
            examples:
              captureKey:
                summary: Create a capture key for the default tenant
                value:
                  tenantId: default
                  scopes: [capture]
                  name: ci-pipeline
              readOnlyKey:
                summary: Create a read-only key
                value:
                  tenantId: default
                  scopes: [read]
                  name: dashboard-reader
      responses:
        '201':
          description: >
            Key created. The raw key is returned exactly once.
            Store it immediately.
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Frame-Options:
              $ref: '#/components/headers/XFrameOptions'
            Strict-Transport-Security:
              $ref: '#/components/headers/StrictTransportSecurity'
            Link:
              $ref: '#/components/headers/TermsLink'
            Cache-Control:
              description: Prevents caching of sensitive key material.
              schema:
                type: string
                enum: ['private, no-store']
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminKeyCreated'
              examples:
                created:
                  summary: Key created successfully
                  value:
                    key: 'wrl_live_aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789abcdefghij'
                    keyHash: 'a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6'
                    tenantId: default
                    scopes: [capture]
                    name: ci-pipeline
                    createdAt: '2026-03-17T12:00:00.000Z'
                    warning: 'Store this key now. It cannot be retrieved after this response.'
        '400':
          description: >
            Bad request -- missing or invalid fields. Field validation messages
            identify the specific problem.
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Frame-Options:
              $ref: '#/components/headers/XFrameOptions'
            Strict-Transport-Security:
              $ref: '#/components/headers/StrictTransportSecurity'
            Link:
              $ref: '#/components/headers/TermsLink'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                missingTenantId:
                  value: {type: about:blank, status: 400, title: Bad Request, detail: "Field 'tenantId' is required"}
                invalidTenantId:
                  value: {type: about:blank, status: 400, title: Bad Request, detail: "Field 'tenantId' must match /^[a-z0-9_-]{1,64}$/"}
                invalidScope:
                  value: {type: about:blank, status: 400, title: Bad Request, detail: "Field 'scopes' contains invalid value 'write'; must be one of: capture, read, admin"}
                missingName:
                  value: {type: about:blank, status: 400, title: Bad Request, detail: "Field 'name' is required"}
        '401':
          description: Unauthorized -- missing or invalid admin key.
          headers:
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Frame-Options:
              $ref: '#/components/headers/XFrameOptions'
            Strict-Transport-Security:
              $ref: '#/components/headers/StrictTransportSecurity'
            Link:
