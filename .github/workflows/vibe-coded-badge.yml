name: Update Vibe Coded Badge

# Manual only since 2026-10-23. The analysis runs git blame on every tracked
# file (about 3,000, most of them under docs/history/) at 10-30 seconds each,
# so it hit the 100-minute timeout on every push after 2026-04-01 and never
# saved its cache. The README badge keeps its last computed value.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip vibe-badge]')"
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.BADGE_PAT }}
      - uses: ./.github/actions/vibe-badge
        with:
          github-token: ${{ secrets.BADGE_PAT }}
