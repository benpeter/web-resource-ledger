# Rollback: see OPERATIONS.md

name: Deploy to Production

on:
  # COUPLING: "Deploy to Staging" must match the `name:` field in deploy-staging.yml.
  # Renaming that workflow without updating this reference breaks the production trigger silently.
  workflow_run:
    workflows: ["Deploy to Staging"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (tag, branch, or SHA). Defaults to triggering ref. Used for rollbacks.'
        required: false
        type: string

permissions:
  contents: read
  deployments: write

jobs:
  staging-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: ./scripts/smoke-test.sh
        env:
          SMOKE_URL: ${{ vars.WRL_STAGING_BASE_URL }}
          SMOKE_API_KEY: ${{ secrets.WRL_STAGING_CAPTURE_API_KEY }}

  deploy:
    needs: staging-smoke
    if: |
      always() && (
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        (github.event_name == 'workflow_dispatch' && needs.staging-smoke.result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Resolve build metadata
        id: meta
        run: |
          sha=$(git rev-parse HEAD)
          version=$(jq -r .version package.json)
          if ! echo "$sha" | grep -qE '^[0-9a-f]{40}$'; then echo "Invalid SHA: $sha" >&2; exit 1; fi
          if ! echo "$version" | grep -qE '^\d+\.\d+\.\d+'; then echo "Invalid version: $version" >&2; exit 1; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      # D1 migrations are applied manually before deploy (the deploy API token
      # lacks D1 permissions). Run: wrangler d1 migrations apply DB --remote
      - uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: >-
            deploy
            --define BUILD_COMMIT:"'${{ steps.meta.outputs.sha }}'"
            --define BUILD_VERSION:"'${{ steps.meta.outputs.version }}'"
            --define BUILD_DEPLOYED_AT:"'${{ steps.meta.outputs.timestamp }}'"
            --define BUILD_ENV:"'production'"

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: ./scripts/smoke-test.sh
        env:
          SMOKE_URL: ${{ vars.WRL_PROD_BASE_URL }}
          SMOKE_API_KEY: ${{ secrets.WRL_PROD_CAPTURE_API_KEY }}
          SMOKE_SKIP_CAPTURE: "1"
          GITHUB_SHA: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}
