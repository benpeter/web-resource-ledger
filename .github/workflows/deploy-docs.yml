name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'openapi.yaml'
      - 'src/design-system.css'
      - 'src/pirsch.js'
      - 'src/log.js'
  workflow_dispatch:

# Note: CLOUDFLARE_API_TOKEN must have Workers Scripts:Edit and Workers Routes:Edit
# permissions for the wrl-docs Worker. Prefer a resource-scoped token over account-wide.

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install site dependencies
        run: cd site && npm ci

      - name: Build docs
        run: npm run build:docs

      - name: Check internal links
        run: |
          broken=$(find site/_output -name '*.html' \
            -exec grep -ohP 'href="\K/[^"]*' {} \; \
            | sed 's/#.*//' \
            | sort -u \
            | while read -r link; do
                [ -z "$link" ] && continue
                path="site/_output${link%/}/index.html"
                if [ ! -f "$path" ] && [ ! -f "site/_output${link}" ]; then
                  echo "BROKEN: $link"
                fi
              done)
          if [ -n "$broken" ]; then
            echo "$broken"
            exit 1
          fi

      - name: Lighthouse accessibility check
        run: |
          npx @lhci/cli autorun \
            --collect.staticDistDir=site/_output \
            --assert.assertions.categories:accessibility=error \
            --assert.minScore.accessibility=0.9 \
            --upload.target=temporary-public-storage

      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: site
          command: deploy
          secrets: |
            PIRSCH_ACCESS_KEY
            CORALOGIX_SEND_KEY
        env:
          PIRSCH_ACCESS_KEY: ${{ secrets.WRL_PIRSCH_ACCESS_KEY }}
          CORALOGIX_SEND_KEY: ${{ secrets.WRL_CORALOGIX_SEND_KEY }}

      # Assert the Worker actually fronts the site. If run_worker_first got
      # dropped (old wrangler, config drift), assets are served straight from
      # the CDN cache: no CSP header, no tracking -- and nothing fails. This
      # check turns that silent regression into a red deploy.
      - name: Verify Worker serves the site
        run: |
          for i in 1 2 3 4 5 6; do
            headers=$(curl -sI --max-time 10 https://docs.webresourceledger.com/ || true)
            if echo "$headers" | grep -qi '^content-security-policy:'; then
              echo "OK: Worker security headers present"
              exit 0
            fi
            echo "Attempt $i: CSP header missing, retrying in 10s..."
            sleep 10
          done
          echo "FAIL: Worker is not serving docs.webresourceledger.com (no CSP header)."
          echo "Likely cause: assets.run_worker_first missing from the deployed version."
          exit 1
