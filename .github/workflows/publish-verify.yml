# Publishes the @w-r-l/verify package to npmjs.com when a tag matching
# verify/v* is pushed (e.g. verify/v0.2.0).
#
# Prerequisites:
#   - NPM_TOKEN secret must be provisioned in repository settings with
#     publish access to the @w-r-l scope.
#
# Note: tags use a verify/v* prefix (not bare v*) because path filters
# don't work on tag push events -- the prefix is the only scoping mechanism.

name: Publish @w-r-l/verify

on:
  push:
    tags:
      - 'verify/v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        working-directory: packages/verify
        run: npm ci

      - name: Run tests
        working-directory: packages/verify
        run: npm test

      - name: Check NPM_TOKEN is set
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set. Configure it in repository settings."
            exit 1
          fi

      - name: Verify version matches tag
        working-directory: packages/verify
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#verify/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Publish to npm
        working-directory: packages/verify
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          OUTPUT=$(npm publish --provenance --access public 2>&1) || {
            EXIT_CODE=$?
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -q 'EPUBLISHCONFLICT\|cannot publish over\|E409'; then
              echo "::warning::Version already published -- skipping"
              exit 0
            fi
            exit $EXIT_CODE
          }
          echo "$OUTPUT"
