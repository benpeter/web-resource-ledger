# Publishes the @w-r-l/verify package to npmjs.com when a tag matching
# verify/v* is pushed (e.g. verify/v0.2.0).
#
# Authentication: npm trusted publishing (OIDC). The package's settings on
# npmjs.com trust this repository's publish-verify.yml; the job's id-token
# permission lets npm exchange the GitHub OIDC token for a publish token. No
# NPM_TOKEN secret. Trusted publishing needs npm 11.5.1 or later; Node 22
# ships npm 10, so the job installs npm 11 first.
#
# Note: tags use a verify/v* prefix (not bare v*) because path filters
# don't work on tag push events -- the prefix is the only scoping mechanism.

name: Publish @w-r-l/verify

on:
  push:
    tags:
      - 'verify/v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: 'packages/verify/package-lock.json'

      - name: Install dependencies
        working-directory: packages/verify
        run: npm ci

      - name: Run tests
        working-directory: packages/verify
        run: npm test

      - name: Install npm 11 (trusted publishing needs 11.5.1 or later)
        run: npm install -g npm@11

      - name: Verify version matches tag
        working-directory: packages/verify
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#verify/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Publish to npm
        working-directory: packages/verify
        run: |
          OUTPUT=$(npm publish --provenance --access public 2>&1) || {
            EXIT_CODE=$?
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -q 'EPUBLISHCONFLICT\|cannot publish over\|E409'; then
              echo "::warning::Version already published -- skipping"
              exit 0
            fi
            exit $EXIT_CODE
          }
          echo "$OUTPUT"
