name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The autoconsent workflow dispatches CI on its PR branch: GitHub holds
  # pull_request runs for PRs opened with the workflow token.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # vitest-pool-workers hangs in some runs on ubuntu-26.04 (since 2026-11-14,
    # never on 24.04); back to ubuntu-latest with the vitest 4 move (backlog #85)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check version sync
        run: ./scripts/check-version-sync.sh
      - name: Check changelog updated
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          CHANGED=$(git diff --name-only "$BASE_SHA"...HEAD)
          if echo "$CHANGED" | grep -qE '^(src/|openapi\.yaml)'; then
            if ! echo "$CHANGED" | grep -q '^CHANGELOG.md'; then
              echo "::warning::API-affecting files changed but CHANGELOG.md was not updated. If this PR changes API behavior, please update the changelog."
            fi
          fi
      - name: Check for code changes
        id: changes
        run: |
          BASE_REF="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE_REF" ]; then BASE_REF=$(git merge-base origin/main HEAD); fi
          if git diff --name-only "$BASE_REF"...HEAD | grep -qvE '\.md$|^docs/|^site/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - if: steps.changes.outputs.code == 'true'
        run: npm ci
      # npm test takes about 95 s. Some runs since 2026-11-14 hang in it; a step
      # timeout fails the step and keeps the log, a job timeout discards it.
      - if: steps.changes.outputs.code == 'true'
        timeout-minutes: 5
        run: npm test
      - if: steps.changes.outputs.code == 'true'
        run: npm run test:sync
      - if: steps.changes.outputs.code == 'true'
        run: npm run lint:api
      - if: steps.changes.outputs.code == 'false'
        run: echo "Docs-only change -- skipping tests and lint."

  test-integration:
    # vitest-pool-workers hangs in some runs on ubuntu-26.04 (since 2026-11-14,
    # never on 24.04); back to ubuntu-latest with the vitest 4 move (backlog #85)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true  # Integration tests require real browser rendering; flaky without live CF infrastructure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check for code changes
        id: changes
        run: |
          BASE_REF="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE_REF" ]; then BASE_REF=$(git merge-base origin/main HEAD); fi
          if git diff --name-only "$BASE_REF"...HEAD | grep -qvE '\.md$|^docs/|^site/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - if: steps.changes.outputs.code == 'true'
        run: npm ci
      - if: steps.changes.outputs.code == 'true'
        run: npm run test:integration
      - if: steps.changes.outputs.code == 'false'
        run: echo "Docs-only change -- skipping integration tests."
