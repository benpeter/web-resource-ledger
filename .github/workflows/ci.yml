name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Check version sync
        run: ./scripts/check-version-sync.sh
      - name: Check changelog updated
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          CHANGED=$(git diff --name-only "$BASE_SHA"...HEAD)
          if echo "$CHANGED" | grep -qE '^(src/|openapi\.yaml)'; then
            if ! echo "$CHANGED" | grep -q '^CHANGELOG.md'; then
              echo "::warning::API-affecting files changed but CHANGELOG.md was not updated. If this PR changes API behavior, please update the changelog."
            fi
          fi
      - name: Check for code changes
        id: changes
        run: |
          BASE_REF="${{ github.event.pull_request.base.sha || github.event.before }}"
          if git diff --name-only "$BASE_REF"...HEAD | grep -qvE '\.md$|^docs/|^site/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - if: steps.changes.outputs.code == 'true'
        run: npm ci
      - if: steps.changes.outputs.code == 'true'
        run: npm test
      - if: steps.changes.outputs.code == 'true'
        run: npm run test:sync
      - if: steps.changes.outputs.code == 'true'
        run: npm run lint:api
      - if: steps.changes.outputs.code == 'false'
        run: echo "Docs-only change -- skipping tests and lint."

  test-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true  # Integration tests require real browser rendering; flaky without live CF infrastructure
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Check for code changes
        id: changes
        run: |
          BASE_REF="${{ github.event.pull_request.base.sha || github.event.before }}"
          if git diff --name-only "$BASE_REF"...HEAD | grep -qvE '\.md$|^docs/|^site/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - if: steps.changes.outputs.code == 'true'
        run: npm ci
      - if: steps.changes.outputs.code == 'true'
        run: npm run test:integration
      - if: steps.changes.outputs.code == 'false'
        run: echo "Docs-only change -- skipping integration tests."
