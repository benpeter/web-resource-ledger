<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="#2a3444" stroke-linecap="round" stroke-linejoin="round">
  <!--
    Favicon: W-check mark (Concept A).
    Single-path design survives 16x16 rendering without detail loss.
    The right leg of the W exits downward then kicks up at checkmark angle,
    giving a recognisable "W" silhouette with a verification inflection.
  -->
  <polyline
    points="4,7 10,23 16,11 22,23 25,26 29,9"
    stroke-width="2.5"
  />
</svg>
